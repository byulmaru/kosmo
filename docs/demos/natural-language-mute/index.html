<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>보고 싶은 이야기는 그대로 · KOSMO 자연어 뮤트</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #ffffff;
        --surface: #fafafb;
        --ink: #1a1a1a;
        --secondary: #64646f;
        --line: #dfdfe5;
        --primary: #ffe597;
        --subtle: #fff9e6;
        --selected: #ae8512;
        --focus: #4f46e5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font:
          16px/1.5 'SUIT Variable',
          'Apple SD Gothic Neo',
          'Malgun Gothic',
          sans-serif;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      main {
        max-width: 1280px;
        margin: auto;
        padding: 32px;
      }
      .brandline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--line);
      }
      .brandline img {
        width: 48px;
        height: 48px;
      }
      .eyebrow,
      .caption {
        font-size: 14px;
        line-height: 20px;
        color: var(--secondary);
      }
      h1 {
        margin: 12px 0;
        font-size: 24px;
        line-height: 1.3;
      }
      h2 {
        margin: 0;
        font-size: 20px;
        line-height: 1.3;
      }
      p {
        margin: 0;
      }
      .intro {
        margin: 24px 0 32px;
      }
      .screens {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 24px;
      }
      .scene {
        min-width: 0;
        margin: 0;
      }
      .step {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      .number {
        display: grid;
        place-items: center;
        min-width: 32px;
        height: 32px;
        border-radius: 999px;
        background: var(--primary);
        font-size: 14px;
        font-weight: 700;
      }
      .description {
        min-height: 48px;
        margin-bottom: 16px;
        color: var(--secondary);
      }
      .screen-link {
        display: block;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--canvas);
      }
      .screen-link:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 4px;
      }
      .screen-link img {
        display: block;
        width: 100%;
        height: auto;
      }
      .result .screen-link {
        border: 2px solid var(--selected);
      }
      .note {
        margin-top: 16px;
        padding: 12px 16px;
        border-radius: 8px;
        background: var(--surface);
        font-size: 14px;
        line-height: 20px;
      }
      .result .note {
        background: var(--subtle);
      }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        padding-top: 24px;
        margin-top: 32px;
        border-top: 1px solid var(--line);
      }
      @media (max-width: 900px) {
        main {
          padding: 24px 16px;
        }
        .screens {
          grid-template-columns: 1fr;
          gap: 32px;
        }
        .scene {
          width: 100%;
          max-width: 480px;
          margin: auto;
        }
        .description {
          min-height: 0;
        }
        footer {
          flex-direction: column;
          gap: 12px;
        }
      }
      @media print {
        .scene {
          break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="brandline">
        <img src="brand-mark.png" width="48" height="48" alt="KOSMO" />
        <p class="eyebrow">코미버스 · 자연어 뮤트 구상</p>
      </header>
      <div class="intro">
        <p class="eyebrow">보고 싶지 않은 내용을 문장으로 설정한다면?</p>
        <h1>작품 이야기는 즐기고, 스포일러는 잠시 가려두세요.</h1>
        <p>코스모 화면으로 보는 적용 예시. 문장 하나가 피드를 어떻게 바꾸는지 살펴보세요.</p>
      </div>
      <div class="screens">
        <figure class="scene">
          <figcaption>
            <div class="step">
              <span class="number">1</span>
              <h2>피하고 싶은 내용을 적어요</h2>
            </div>
            <p class="description">
              “아직 보지 않은 작품의 결말이나 반전 이야기는 보고 싶지 않아요.”
            </p>
          </figcaption>
          <a class="screen-link" href="setting.jpg" aria-label="문장 설정 예시 이미지 크게 보기"
            ><img
              src="setting.jpg"
              width="390"
              height="844"
              alt="코스모의 입력 필드에 결말과 반전을 보고 싶지 않다는 문장이 적혀 있고, 이 조건으로 뮤트하기 버튼과 가림 조건이 표시된 예시."
          /></a>
          <p class="note">가릴 내용: <strong>작품의 결말·반전을 직접 알려주는 글</strong></p>
        </figure>
        <figure class="scene">
          <figcaption>
            <div class="step">
              <span class="number">2</span>
              <h2>적용 전에는 모두 보여요</h2>
            </div>
            <p class="description">
              결말을 밝히는 글, 작화 감상, 행사 준비 글이 같은 피드에 있어요.
            </p>
          </figcaption>
          <a class="screen-link" href="before.jpg" aria-label="적용 전 피드 이미지 크게 보기"
            ><img
              src="before.jpg"
              width="390"
              height="844"
              alt="코스모 홈 피드. 달빛의 글은 정원사가 미래의 주인공이라는 반전을 공개한다. 아래에는 여울의 작화 감상과 모아의 코미버스 준비 글이 있다."
          /></a>
          <p class="note">첫 번째 글은 <strong>반전을 직접 알려주는 내용</strong>이에요.</p>
        </figure>
        <figure class="scene result">
          <figcaption>
            <div class="step">
              <span class="number">3</span>
              <h2>스포일러 글만 가려져요</h2>
            </div>
            <p class="description">
              같은 글과 순서 그대로. 첫 번째 글의 본문만 가림 표시로 바뀌었어요.
            </p>
          </figcaption>
          <a class="screen-link" href="after.jpg" aria-label="적용 후 피드 이미지 크게 보기"
            ><img
              src="after.jpg"
              width="390"
              height="844"
              alt="같은 코스모 홈 피드에 뮤트 중 안내가 나타난다. 달빛의 첫 글 본문은 눈 가림 아이콘과 뮤트한 내용 · 작품 결말·반전, 보기 표시로 대체된다. 작화 감상과 행사 준비 글은 그대로 보인다."
          /></a>
          <p class="note">
            <strong>작화 감상·행사 준비 글은 그대로.</strong> 같은 작품을 말해도 결말을 밝히지 않는
            글은 남아요.
          </p>
        </figure>
      </div>
      <footer class="caption">
        <p>
          기존 코스모 UI로 구성한 소개용 목업입니다. 설정과 가림 결과는 준비된 예시이며 실제 서비스
          기능·모델 판단이 아닙니다.
        </p>
        <p>작품·인물·글은 모두 가상입니다.<br />각 화면을 누르면 크게 볼 수 있어요.</p>
      </footer>
    </main>
  </body>
</html>
