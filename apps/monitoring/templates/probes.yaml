  labels:
    helm.sh/chart: '{{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}'
    app.kubernetes.io/name: kosmo-monitoring
    app.kubernetes.io/instance: '{{ .Release.Name }}'
    app.kubernetes.io/managed-by: '{{ .Release.Service }}'
spec:
  jobName: kosmo-public
  interval: 30s
  scrapeTimeout: 10s
  module: http_2xx
  prober:
    url: http://prometheus-blackbox-exporter.kosmo-prod.svc:9115/probe
