apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: kosmo-public-alerts-slack
  labels:
    {{- include "kosmo-monitoring.labels" . | nindent 4 }}
spec:
  route:
    receiver: slack-kosmo-public
    groupBy:
      - cluster
      - namespace
      - alertname
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    matchers:
      - name: alertname
        value: KosmoPublicEndpointDown|KosmoPublicEndpointHighLatency
        matchType: =~
  receivers:
    - name: slack-kosmo-public
      slackConfigs:
        - apiURL:
            name: alertmanager-slack-webhook
            key: SLACK_WEBHOOK_URL
          channel: "#monitoring"
          sendResolved: true
