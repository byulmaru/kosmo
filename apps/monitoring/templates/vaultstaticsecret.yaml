apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: alertmanager-slack-webhook
  labels:
    {{- include "kosmo-monitoring.labels" . | nindent 4 }}
spec:
  vaultAuthRef: vso-kubernetes-sync
  mount: secret
  type: kv-v2
  path: kubernetes/alertmanager/slack
  refreshAfter: 5m
  destination:
    name: alertmanager-slack-webhook
    create: true
    overwrite: true
    type: Opaque
    transformation:
      includes:
        - ^SLACK_WEBHOOK_URL$
