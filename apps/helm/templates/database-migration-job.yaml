{{- $isDev := eq .Values.env "dev" -}}
{{- $isProductionMigration := and (eq .Values.env "prod") .Values.migration.enabled -}}
{{- if $isProductionMigration -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" (default "" .Values.imageDigest)) -}}
{{- fail "production migration requires imageDigest=sha256:<64 lowercase hex>" -}}
{{- end -}}
{{- end -}}
{{- if or $isDev $isProductionMigration }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-db-migrate" .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    helm.sh/chart: {{ include "kosmo.chart" . }}
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Values.version | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: db-migrate
          image: {{ include "kosmo.imageRef" . | quote }}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          args:
            - migrate
          env:
            {{- if $isProductionMigration }}
            - name: PGHOST
              value: {{ printf "%s-rw" (include "kosmo.postgresName" .) | quote }}
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: "kosmo"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-postgres-migration" .Release.Name | trunc 63 | trimSuffix "-" | quote }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-postgres-migration" .Release.Name | trunc 63 | trimSuffix "-" | quote }}
                  key: password
            {{- else }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-app" (include "kosmo.postgresName" .) | quote }}
                  key: password
            - name: DATABASE_URL
              value: {{ include "kosmo.databaseUrl" . | quote }}
            {{- end }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
{{- end }}
