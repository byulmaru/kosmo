{{- if .Values.admin.enabled }}
{{- $hostname := required "admin.tailscale.hostname is required when admin.enabled=true" .Values.admin.tailscale.hostname }}
{{- $fqdn := required "admin.tailscale.fqdn is required when admin.enabled=true" .Values.admin.tailscale.fqdn }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-admin" .Release.Name | trunc 63 | trimSuffix "-" }}
  annotations:
    tailscale.com/hostname: {{ $hostname | quote }}
  labels:
    helm.sh/chart: {{ include "kosmo.chart" . }}
    app.kubernetes.io/name: admin
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Values.version | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - {{ $fqdn | quote }}
  rules:
    - host: {{ $fqdn | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-admin" .Release.Name | trunc 63 | trimSuffix "-" }}
                port:
                  number: 80
{{- end }}
