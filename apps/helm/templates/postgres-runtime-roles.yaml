{{- $releaseName := .Release.Name | trunc 47 | trimSuffix "-" }}
{{- $queueResourceName := printf "%s-postgres-fedify-queue" (.Release.Name | trunc 41 | trimSuffix "-") }}
{{- $queueWorkloadEnabled := or .Values.fedify.producer.enabled .Values.fedify.consumer.enabled }}
{{- if and $queueWorkloadEnabled (not .Values.fedify.queueDatabase.enabled) }}
{{- fail "fedify.queueDatabase.enabled must be true when a Fedify queue workload is enabled" }}
{{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: {{ printf "%s-postgres-api" $releaseName }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm
  labels:
    helm.sh/chart: {{ include "kosmo.chart" . }}
    app.kubernetes.io/name: postgres-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  cluster:
    name: {{ include "kosmo.postgresName" . }}
  name: kosmo_api
  login: true
  inherit: true
  superuser: false
  createdb: false
  createrole: false
  replication: false
  bypassrls: false
  inRoles: []
  passwordSecret:
    name: {{ printf "%s-postgres-api" $releaseName }}
  databaseRoleReclaimPolicy: retain
{{- if .Values.fedify.queueDatabase.enabled }}
{{- $queue := .Values.postgres.credentials.fedifyQueue | default dict }}
{{- $passwordSecret := $queue.passwordSecret | default dict }}
{{- $passwordSecretName := $passwordSecret.name | default "" | toString }}
{{- $passwordSecretKey := $passwordSecret.key | default "" | toString }}
{{- $databaseUrl := $queue.databaseUrl | default "" | toString }}
{{- $expectedPasswordSecretName := $queueResourceName }}
{{- if ne $passwordSecretName $expectedPasswordSecretName }}
{{- fail (printf "postgres.credentials.fedifyQueue.passwordSecret.name must be %s when fedify.queueDatabase.enabled is true" $expectedPasswordSecretName) }}
{{- end }}
{{- if ne $passwordSecretKey "password" }}
{{- fail "postgres.credentials.fedifyQueue.passwordSecret.key must be password when fedify.queueDatabase.enabled is true" }}
{{- end }}
{{- if not $databaseUrl }}
{{- fail "postgres.credentials.fedifyQueue.databaseUrl is required when fedify.queueDatabase.enabled is true" }}
{{- end }}
{{- $queueUrlPattern := printf "^postgres(ql)?://kosmo_fedify_queue:[^@]+@%s:5432/kosmo_fedify_queue(?:\\?.*)?$" (include "kosmo.postgresPoolerName" .) }}
{{- if not (regexMatch $queueUrlPattern $databaseUrl) }}
{{- fail (printf "postgres.credentials.fedifyQueue.databaseUrl must target kosmo_fedify_queue through %s:5432" (include "kosmo.postgresPoolerName" .)) }}
{{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: {{ $queueResourceName }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    helm.sh/chart: {{ include "kosmo.chart" . }}
    app.kubernetes.io/name: postgres-fedify-queue
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  cluster:
    name: {{ include "kosmo.postgresName" . }}
  name: kosmo_fedify_queue
  login: true
  inherit: true
  superuser: false
  createdb: false
  createrole: false
  replication: false
  bypassrls: false
  inRoles: []
  passwordSecret:
    name: {{ $expectedPasswordSecretName | quote }}
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ printf "%s-postgres-fedify-queue-database" $releaseName | trunc 63 | trimSuffix "-" }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    helm.sh/chart: {{ include "kosmo.chart" . }}
    app.kubernetes.io/name: postgres-fedify-queue-database
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  cluster:
    name: {{ include "kosmo.postgresName" . }}
  name: kosmo_fedify_queue
  owner: kosmo_fedify_queue
  databaseReclaimPolicy: retain
{{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: {{ printf "%s-postgres-worker" $releaseName }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm
  labels:
    helm.sh/chart: {{ include "kosmo.chart" . }}
    app.kubernetes.io/name: postgres-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  cluster:
    name: {{ include "kosmo.postgresName" . }}
  name: kosmo_worker
  login: true
  inherit: true
  superuser: false
  createdb: false
  createrole: false
  replication: false
  bypassrls: true
  inRoles: []
  passwordSecret:
    name: {{ printf "%s-postgres-worker" $releaseName }}
  databaseRoleReclaimPolicy: retain
