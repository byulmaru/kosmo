{{- if .Values.secrets.clusterSecretStore }}
{{- $env := .Values.env -}}
{{- $databaseSecrets := list
  (dict "name" "fedify-queue-database" "target" (include "kosmo.fedifyQueueResourceName" .) "remotePath" (printf "kubernetes/kosmo/%s/fedify-queue" $env) "syncWave" "-3")
  (dict "name" "api-database" "target" (printf "%s-postgres-api" (.Release.Name | trunc 47 | trimSuffix "-")) "remotePath" (printf "kubernetes/kosmo/%s/api-database" $env))
  (dict "name" "worker-database" "target" (include "kosmo.workerDatabasePasswordSecretName" .) "remotePath" (printf "kubernetes/kosmo/%s/worker-database" $env))
  (dict "name" "runtime-database" "target" (include "kosmo.runtimeDatabasePasswordSecretName" .) "remotePath" (printf "kubernetes/kosmo/%s/runtime-database" $env))
-}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "env"
  labels:
    helm.sh/chart: {{ include "kosmo.chart" . }}
    app.kubernetes.io/name: env
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secrets.clusterSecretStore | quote }}
  target:
    name: "env"
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: {{ printf "kubernetes/kosmo/%s" $env | quote }}
{{- range $databaseSecret := $databaseSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $databaseSecret.name | quote }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm
    {{- with $databaseSecret.syncWave }}
    argocd.argoproj.io/sync-wave: {{ . | quote }}
    {{- end }}
  labels:
    helm.sh/chart: {{ include "kosmo.chart" $ }}
    app.kubernetes.io/name: {{ $databaseSecret.name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.secrets.clusterSecretStore | quote }}
  target:
    name: {{ $databaseSecret.target | quote }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: {{ $databaseSecret.remotePath | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ $databaseSecret.remotePath | quote }}
        property: password
{{- end }}
{{- end }}
