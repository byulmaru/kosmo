{{- $oke := eq .Values.postgres.existingCluster "kosmo-postgres" }}
{{- if and (eq .Values.env "prod") (or $oke (not .Values.postgres.existingCluster)) }}
{{- if $oke }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: kosmo-postgres-backup-s3
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: vso-kubernetes-sync
  mount: secret
  type: kv-v2
  path: kubernetes/kosmo/prod/postgres-backup
  refreshAfter: 5m
  destination:
    name: kosmo-postgres-backup-s3
    create: true
    overwrite: true
    transformation:
      includes:
        - "^ACCESS_KEY_ID$"
        - "^ACCESS_SECRET_KEY$"
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kosmo-postgres-backup
  labels:
    helm.sh/chart: {{ include "kosmo.chart" . }}
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
---
{{- if not $oke }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kosmo-postgres-backup-objectstore-reader
  labels:
    helm.sh/chart: {{ include "kosmo.chart" . }}
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
  - apiGroups:
      - barmancloud.cnpg.io
    resources:
      - objectstores
    resourceNames:
      - kosmo-postgres-backup
    verbs:
      - get
  - apiGroups:
      - barmancloud.cnpg.io
    resources:
      - objectstores/status
    resourceNames:
      - kosmo-postgres-backup
    verbs:
      - update
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ if $oke }}kosmo-postgres-backup-cnpg{{ else }}kosmo-postgres-backup-objectstore-reader{{ end }}
  labels:
    helm.sh/chart: {{ include "kosmo.chart" . }}
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
subjects:
  - kind: ServiceAccount
    name: kosmo-postgres-backup
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ if $oke }}{{ include "kosmo.postgresName" . }}{{ else }}kosmo-postgres-backup-objectstore-reader{{ end }}
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: kosmo-postgres-backup
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm
    {{- if $oke }}
    argocd.argoproj.io/sync-wave: "-1"
    {{- end }}
  labels:
    helm.sh/chart: {{ include "kosmo.chart" . }}
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  configuration:
    {{- if $oke }}
    destinationPath: s3://byulmaru-kosmo-prod-backup/kosmo-prod/
    endpointURL: https://ax1l6f331yog.compat.objectstorage.ap-chuncheon-1.oci.customer-oci.com
    s3Credentials:
      accessKeyId:
        name: kosmo-postgres-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: kosmo-postgres-backup-s3
        key: ACCESS_SECRET_KEY
    {{- else }}
    destinationPath: s3://byulmaru-kosmo-prod-postgresql-backups-822638974464/kosmo-prod/
    s3Credentials:
      inheritFromIAMRole: true
    {{- end }}
  retentionPolicy: 7d
  instanceSidecarConfiguration:
    {{- if $oke }}
    env:
      - name: AWS_DEFAULT_REGION
        value: ap-chuncheon-1
    {{- end }}
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        cpu: 50m
        memory: 384Mi
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: kosmo-postgres-daily
  {{- if $oke }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  {{- end }}
  labels:
    helm.sh/chart: {{ include "kosmo.chart" . }}
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  schedule: "0 0 18 * * *"
  backupOwnerReference: self
  cluster:
    name: {{ include "kosmo.postgresName" . }}
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
