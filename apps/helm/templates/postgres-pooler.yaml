{{- $poolers := list (dict "name" (include "kosmo.postgresPoolerName" .) "type" "rw") -}}
{{- if eq .Values.env "prod" -}}
{{- $poolers = append $poolers (dict "name" (include "kosmo.postgresReadPoolerName" .) "type" "ro") -}}
{{- end -}}
{{- range $pooler := $poolers }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ $pooler.name }}
  labels:
    helm.sh/chart: {{ include "kosmo.chart" $ }}
    app.kubernetes.io/name: postgres-pooler
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  cluster:
    name: {{ include "kosmo.postgresName" $ }}
  instances: {{ ternary $.Values.postgres.pooler.replicas.prod $.Values.postgres.pooler.replicas.dev (eq $.Values.env "prod") }}
  type: {{ $pooler.type }}
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: {{ $.Values.postgres.pooler.maxClientConnections | quote }}
      default_pool_size: {{ $.Values.postgres.pooler.defaultPoolSize | quote }}
      server_reset_query: "DISCARD ALL"
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              cnpg.io/poolerName: {{ $pooler.name | quote }}
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: pgbouncer
          resources:
{{ toYaml $.Values.postgres.pooler.resources | indent 12 }}
{{- end }}
