{{- include "kosmo.validatePostgresCredentials" . -}}
{{- if .Values.workloads.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ printf "%s-web" .Release.Name | trunc 63 | trimSuffix "-" }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    helm.sh/chart: {{ include "kosmo.chart" . }}
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Values.version | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  {{- if ne .Values.env "prod" }}
  replicas: 1
  {{- end }}
  strategy:
    blueGreen:
      activeService: {{ printf "%s-web" .Release.Name | trunc 63 | trimSuffix "-" }}
      previewService: {{ printf "%s-web-preview" .Release.Name | trunc 63 | trimSuffix "-" }}
      previewReplicaCount: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Values.version | quote }}
    spec:
      containers:
        - name: web
          image: {{ include "kosmo.imageRef" . | quote }}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          args:
            - web
          env:
            - name: ENVIRONMENT
              value: {{ .Values.env | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kosmo.apiDatabasePasswordSecretName" . | quote }}
                  key: {{ include "kosmo.apiDatabasePasswordSecretKey" . }}
            - name: DATABASE_URL
              value: {{ include "kosmo.apiDatabaseUrl" . | quote }}
            - name: FEDIFY_QUEUE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kosmo.fedifyQueueResourceName" . | quote }}
                  key: password
            - name: FEDIFY_QUEUE_DATABASE_URL
              value: {{ printf "postgres://kosmo_fedify_queue@%s-rw:5432/kosmo_fedify_queue" (include "kosmo.postgresName" .) | quote }}
            {{- $workerDatabase := get (.Values.postgres.credentials | default dict) "worker" | default dict }}
            {{- if $workerDatabase.databaseUrl }}
            - name: WORKER_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $workerDatabase.passwordSecret.name | quote }}
                  key: {{ $workerDatabase.passwordSecret.key | quote }}
            - name: WORKER_DATABASE_URL
              value: {{ $workerDatabase.databaseUrl | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: env
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
{{- end }}
