{{- if eq .Values.postgres.existingCluster "kosmo-postgres-aws-replica" }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "kosmo.postgresName" . }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm
  labels:
    helm.sh/chart: {{ include "kosmo.chart" . }}
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie@sha256:b4bbd2e623f1a8833e9a2a4210480ef215b6d13fc0988b06786a778a5c699a20
  storage:
    size: 50Gi
    storageClass: oci-bv
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
  affinity:
    topologyKey: topology.kubernetes.io/zone
  primaryUpdateMethod: switchover
  enableSuperuserAccess: true
  bootstrap:
    initdb:
      database: kosmo
      owner: kosmo
{{- end }}
