{{- if eq .Values.postgres.existingCluster "kosmo-postgres" }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kosmo-postgres
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie@sha256:b4bbd2e623f1a8833e9a2a4210480ef215b6d13fc0988b06786a778a5c699a20
  storage:
    size: 50Gi
    storageClass: oci-bv
  resources:
{{ toYaml .Values.postgres.resources.prod | indent 4 }}
  postgresql:
    parameters:
      archive_timeout: 4min
  serviceAccountName: kosmo-postgres-backup
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: kosmo-postgres-backup
  bootstrap:
    initdb:
      database: kosmo
      owner: kosmo
{{- end }}
