{{- if eq .Values.postgres.existingCluster "kosmo-postgres-aws-replica" }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kosmo-postgres
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie@sha256:b4bbd2e623f1a8833e9a2a4210480ef215b6d13fc0988b06786a778a5c699a20
  storage:
    size: 50Gi
    storageClass: oci-bv
  resources:
{{ toYaml .Values.postgres.resources.prod | indent 4 }}
  bootstrap:
    pg_basebackup:
      source: kosmo-postgres-aws-replica
      database: kosmo
      owner: kosmo
  replica:
    enabled: true
    source: kosmo-postgres-aws-replica
  externalClusters:
    - name: kosmo-postgres-aws-replica
      connectionParameters:
        host: kosmo-postgres-aws-replica-rw.{{ .Release.Namespace }}.svc
        user: streaming_replica
        dbname: postgres
        sslmode: verify-full
      sslKey:
        name: kosmo-postgres-aws-replica-replication
        key: tls.key
      sslCert:
        name: kosmo-postgres-aws-replica-replication
        key: tls.crt
      sslRootCert:
        name: kosmo-postgres-aws-replica-ca
        key: ca.crt
{{- end }}
