{{- $apiCertificateEnabled := eq (include "kosmo.postgresCredentialClientCertificateIsConfigured" (list . "api") | trim) "true" -}}
{{- include "kosmo.validatePostgresCredentials" . -}}
{{- if .Values.workloads.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ printf "%s-api" .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    helm.sh/chart: {{ include "kosmo.chart" . }}
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Values.version | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  {{- if ne .Values.env "prod" }}
  replicas: 1
  {{- end }}
  strategy:
    blueGreen:
      activeService: {{ printf "%s-api" .Release.Name | trunc 63 | trimSuffix "-" }}
      previewService: {{ printf "%s-api-preview" .Release.Name | trunc 63 | trimSuffix "-" }}
      previewReplicaCount: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Values.version | quote }}
    spec:
      containers:
        - name: api
          image: {{ include "kosmo.imageRef" . | quote }}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          args:
            - api
          env:
            - name: ENVIRONMENT
              value: {{ .Values.env | quote }}
            {{- if not $apiCertificateEnabled }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kosmo.apiDatabasePasswordSecretName" . | quote }}
                  key: {{ include "kosmo.apiDatabasePasswordSecretKey" . }}
            {{- end }}
            - name: DATABASE_URL
              value: {{ include "kosmo.apiDatabaseUrl" . | quote }}
            {{- if $apiCertificateEnabled }}
            - name: PGSSLCERT
              value: /var/run/secrets/postgres/api/tls.crt
            - name: PGSSLKEY
              value: /var/run/secrets/postgres/api/tls.key
            - name: PGSSLROOTCERT
              value: /var/run/secrets/postgres/ca/ca.crt
            {{- end }}
          envFrom:
            - secretRef:
                name: env
          {{- if $apiCertificateEnabled }}
          volumeMounts:
            - name: postgres-api-client-cert
              mountPath: /var/run/secrets/postgres/api
              readOnly: true
            - name: postgres-cluster-ca
              mountPath: /var/run/secrets/postgres/ca
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      {{- if $apiCertificateEnabled }}
      volumes:
        - name: postgres-api-client-cert
          secret:
            secretName: {{ include "kosmo.postgresRuntimeClientCertificateSecretName" (list . "api") | quote }}
        - name: postgres-cluster-ca
          secret:
            secretName: {{ include "kosmo.postgresClusterCaSecretName" . | quote }}
            items:
              - key: ca.crt
                path: ca.crt
      {{- end }}
{{- end }}
