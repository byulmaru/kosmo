apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ printf "%s-api" .Release.Name | trunc 63 | trimSuffix "-" }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    helm.sh/chart: {{ include "kosmo.chart" . }}
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Values.version | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  {{- if ne .Values.env "prod" }}
  replicas: 1
  {{- end }}
  strategy:
    blueGreen:
      activeService: {{ printf "%s-api" .Release.Name | trunc 63 | trimSuffix "-" }}
      previewService: {{ printf "%s-api-preview" .Release.Name | trunc 63 | trimSuffix "-" }}
      previewReplicaCount: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Values.version | quote }}
    spec:
      containers:
        - name: api
          image: {{ include "kosmo.imageRef" . | quote }}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          args:
            - api
          env:
            - name: ENVIRONMENT
              value: {{ .Values.env | quote }}
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporal.frontendAddress | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ include "kosmo.temporalNamespaceName" . | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kosmo.workerDatabasePasswordSecretName" . | quote }}
                  key: password
            - name: PGHOST
              value: {{ printf "%s-rw" (include "kosmo.postgresName" .) | quote }}
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: kosmo_worker
            - name: PGDATABASE
              value: kosmo
            - name: FEDIFY_QUEUE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kosmo.fedifyQueueResourceName" . | quote }}
                  key: password
            - name: FEDIFY_QUEUE_DATABASE_URL
              value: {{ printf "postgres://kosmo_fedify_queue@%s-rw:5432/kosmo_fedify_queue" (include "kosmo.postgresName" .) | quote }}
          envFrom:
            - secretRef:
                name: env
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
