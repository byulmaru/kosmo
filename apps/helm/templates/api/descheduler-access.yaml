{{- if and (eq .Values.env "prod") .Values.apiDescheduling }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kosmo-api-descheduler
rules:
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kosmo-api-descheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kosmo-api-descheduler
subjects:
  - kind: ServiceAccount
    name: kosmo-api-descheduler
    namespace: kube-system
{{- end }}
