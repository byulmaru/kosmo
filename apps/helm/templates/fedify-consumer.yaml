{{- if .Values.workloads.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-fedify-consumer" .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    helm.sh/chart: {{ include "kosmo.chart" . }}
    app.kubernetes.io/name: fedify-consumer
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Values.version | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-fedify-consumer" .Release.Name | trunc 63 | trimSuffix "-" }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    helm.sh/chart: {{ include "kosmo.chart" . }}
    app.kubernetes.io/name: fedify-consumer
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Values.version | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ get .Values.fedify.consumer.replicas .Values.env }}
  selector:
    matchLabels:
      app.kubernetes.io/name: fedify-consumer
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fedify-consumer
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Values.version | quote }}
    spec:
      serviceAccountName: {{ printf "%s-fedify-consumer" .Release.Name | trunc 63 | trimSuffix "-" }}
      automountServiceAccountToken: false
      containers:
        - name: fedify-consumer
          image: {{ include "kosmo.imageRef" . | quote }}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.fedify.consumer.health.port }}
              protocol: TCP
          args:
            - fedify-queue
          env:
            - name: ENVIRONMENT
              value: {{ .Values.env | quote }}
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporal.frontendAddress | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ include "kosmo.temporalNamespaceName" . | quote }}
            - name: PORT
              value: {{ .Values.fedify.consumer.health.port | quote }}
            - name: HOST
              value: "0.0.0.0"
            - name: FEDIFY_QUEUE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kosmo.fedifyQueueResourceName" . | quote }}
                  key: password
            - name: FEDIFY_QUEUE_DATABASE_URL
              value: {{ printf "postgres://kosmo_fedify_queue@%s-rw:5432/kosmo_fedify_queue" (include "kosmo.postgresName" .) | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-app" (include "kosmo.postgresName" .) | quote }}
                  key: password
            - name: PGHOST
              value: {{ printf "%s-rw" (include "kosmo.postgresName" .) | quote }}
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: kosmo
            - name: PGDATABASE
              value: kosmo
          envFrom:
            - secretRef:
                name: env
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
{{ toYaml .Values.fedify.consumer.resources | indent 12 }}
{{- end }}
