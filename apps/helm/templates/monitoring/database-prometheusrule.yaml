{{- if eq .Values.env "prod" }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kosmo-database
  labels:
    helm.sh/chart: {{ include "kosmo.chart" . }}
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Values.version | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  groups:
    - name: kosmo.database
      rules:
        - alert: KosmoDatabasePrimaryUnavailable
          expr: |
            absent(
              (cnpg_pg_replication_in_recovery{namespace="kosmo-prod",cnpg_cluster="kosmo-postgres",cnpg_role="primary"} == 0)
              and on(namespace,pod) (cnpg_collector_up{namespace="kosmo-prod",cnpg_cluster="kosmo-postgres"} == 1)
              and on(namespace,pod) (up{namespace="kosmo-prod",cnpg_cluster="kosmo-postgres"} == 1)
              and on(namespace,pod) (timestamp(cnpg_pg_replication_in_recovery{namespace="kosmo-prod",cnpg_cluster="kosmo-postgres",cnpg_role="primary"}) > time() - 60)
            )
          for: 2m
          labels:
            severity: critical
            namespace: kosmo-prod
            cnpg_cluster: kosmo-postgres
          annotations:
            summary: Kosmo PostgreSQL primary is unavailable
            description: Prometheus has not observed a fresh primary with a healthy CNPG collector and scrape in kosmo-prod/kosmo-postgres for 2 minutes. This does not verify application or PgBouncer connectivity.
            owner: Platform/SRE
            runbook_url: https://github.com/byulmaru/kosmo/blob/main/docs/operations/postgres-primary-unavailable.md#kosmo-postgresql-primary-unavailable
{{- end }}
