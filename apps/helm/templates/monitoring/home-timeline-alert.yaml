{{- if and (eq .Values.env "prod") (eq .Values.monitoring.alertEvaluator "grafana") .Values.monitoring.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ printf "%s-api-metrics" .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    helm.sh/chart: {{ include "kosmo.chart" . }}
    app.kubernetes.io/name: api-metrics
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: {{ .Release.Name }}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kosmo-home-timeline-alert
  labels:
    grafana_alert: "1"
    helm.sh/chart: {{ include "kosmo.chart" . }}
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  kosmo-home-timeline-alert.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: kosmo.home-timeline
        folder: KOSMO
        interval: 30s
        rules:
          - uid: kosmo-home-timeline-errors
            title: KosmoHomeTimelineHighErrorRate
            condition: B
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  expr: >-
                    (
                      (sum(increase(kosmo_home_timeline_requests_total{namespace="{{ .Release.Namespace }}",job="api",outcome="server_error"}[5m])) or vector(0))
                      / sum(increase(kosmo_home_timeline_requests_total{namespace="{{ .Release.Namespace }}",job="api",outcome=~"success|server_error"}[5m]))
                      and (sum(increase(kosmo_home_timeline_requests_total{namespace="{{ .Release.Namespace }}",job="api",outcome=~"success|server_error"}[5m])) >= 30)
                    ) or vector(0)
                  instant: true
                  range: false
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  expression: A
                  type: threshold
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0.1
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        type: last
                        params: []
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: B
            noDataState: OK
            execErrState: KeepLast
            for: 5m
            labels:
              severity: warning
              namespace: {{ .Release.Namespace | quote }}
            annotations:
              summary: Kosmo home timeline has a high server error rate
              description: Home timeline GraphQL reads exceeded a 10% server error rate for 5 minutes, with at least 30 eligible reads in each rolling 5-minute window. Check API errors in Sentry and the status of timeline cache and database reads.
            notification_settings:
              receiver: platform-slack-monitoring
{{- end }}
