env:
image: ghcr.io/byulmaru/kosmo
imageDigest: ''
version: main
# Allow up to five minutes for startup; readiness and liveness start after the first success.
startupProbe:
  periodSeconds: 10
  failureThreshold: 30
worker:
  # Populated by Terraform-managed Argo CD releases; omit to disable FCM identity wiring.
  fcm: {}
  replicas:
    dev: 1
    prod: 2
  health:
    port: 8080
  posthog:
    host: https://eu.i.posthog.com
    captureKey: phc_wtHL2JZViyDBizGfTYXqjHwejEwJiEwHoEzPZ3DtUmDS
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
autoscaling:
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
migration:
  enabled: false
redis:
  enabled: false
  image: redis:8.2.11-alpine3.22
  digest: sha256:489a769e0a54dc245896132a15c72d2bc7296719954da99398f43a3877e5f8eb
  maxmemory: 128mb
  maxmemoryPolicy: allkeys-lru
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
fedify:
  consumer:
    replicas:
      dev: 1
      prod: 2
    health:
      port: 8080
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
temporal:
  frontendAddress: temporal-frontend.temporal.svc.cluster.local:7233
  adminTools:
    image: temporalio/admin-tools
    digest: sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
  namespace:
    ownerEmail: dev@byulmaru.co
    names:
      dev: kosmo-dev
      prod: kosmo-prod
    retentions:
      dev: 3d
      prod: 30d
postgres:
  resources:
    dev:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 768Mi
    prod:
      requests:
        cpu: 250m
        memory: 1536Mi
      limits:
        cpu: 250m
        memory: 1536Mi
  pooler:
    replicas:
      dev: 1
      prod: 3
    maxClientConnections: 1000
    defaultPoolSize: 10
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
