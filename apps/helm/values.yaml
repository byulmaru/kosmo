env:
image: ghcr.io/byulmaru/kosmo
imageDigest: ''
version: main
workloads:
  enabled: true
autoscaling:
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
migration:
  enabled: false
postgres:
  credentials:
    api:
      databaseUrl: ''
      passwordSecret:
        name: ''
        key: ''
    system:
      databaseUrl: ''
      passwordSecret:
        name: ''
        key: ''
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 250m
      memory: 1Gi
