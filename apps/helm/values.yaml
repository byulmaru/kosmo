env:
image: ghcr.io/byulmaru/kosmo
imageDigest: ''
version: main
workloads:
  enabled: true
autoscaling:
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
migration:
  enabled: false
postgres:
  credentials:
    api:
      databaseUrl: ''
      passwordSecret:
        name: ''
        key: ''
    fedify:
      databaseUrl: ''
      passwordSecret:
        name: ''
        key: ''
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 250m
      memory: 1Gi
  pooler:
    replicas:
      dev: 1
      prod: 3
    maxClientConnections: 1000
    defaultPoolSize: 10
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
