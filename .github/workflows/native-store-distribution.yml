name: Native Store Distribution

on:
  workflow_dispatch:
    inputs:
      release_status:
        description: Play release status for the Alpha release
        required: true
        type: choice
        options:
          - draft
          - completed
        default: completed

permissions:
  contents: read
  id-token: write

jobs:
  android:
    concurrency:
      group: android-play-alpha-distribution
      cancel-in-progress: false

    name: Build and upload Android Alpha AAB
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: prod
    env:
      ANDROID_RELEASE_KEY_ALIAS: ${{ vars.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_PLAY_RELEASE_STATUS: ${{ inputs.release_status }}
      EXPO_NO_GIT_STATUS: '1'
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      KOSMO_ANDROID_AAB_PATH: ${{ github.workspace }}/apps/app/android/app/build/outputs/bundle/release/app-release.aab
      KOSMO_OTA_CHANNEL: prod
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_RELEASE: ${{ github.sha }}
      EXPO_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Connect to Tailscale for Vault
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: tag:github-actions

      - name: Set up mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: '2026.9.2'

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.0.0
        with:
          cache: gradle
          cache-dependency-path: pnpm-lock.yaml
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        with:
          bundler-cache: true
          ruby-version: '3.4'
          working-directory: apps/app

      - name: Calculate Android version code
        shell: bash
        run: |
          set -euo pipefail

          # Keep reruns on the same run number at the same version code.
          version_code=$(( 210579434 + GITHUB_RUN_NUMBER ))
          if (( version_code < 1 || version_code > 2147483647 )); then
            echo "::error::KOSMO_ANDROID_VERSION_CODE is outside the signed 32-bit Android limit."
            exit 1
          fi
          echo "KOSMO_ANDROID_VERSION_CODE=${version_code}" >> "${GITHUB_ENV}"

      - name: Resolve Android OTA runtime version
        working-directory: apps/app
        shell: bash
        run: |
          set -euo pipefail

          runtime_info="$(pnpm exec expo-updates runtimeversion:resolve --platform android --workflow managed)"
          runtime_version="$(printf '%s\n' "${runtime_info}" | node --input-type=module -e 'import fs from "node:fs"; const info = JSON.parse(fs.readFileSync(0, "utf8")); process.stdout.write(typeof info.runtimeVersion === "string" ? info.runtimeVersion : "");')"
          if [[ ! "${runtime_version}" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "::error::Resolved Android runtimeVersion must be a lowercase fingerprint hash."
            exit 1
          fi
          echo "KOSMO_OTA_RUNTIME_VERSION=${runtime_version}" >> "${GITHUB_ENV}"
          echo "Resolved Android OTA runtimeVersion: ${runtime_version}"

      - name: Validate Android Play inputs
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            ANDROID_RELEASE_KEY_ALIAS \
            GCP_SERVICE_ACCOUNT \
            GCP_WORKLOAD_IDENTITY_PROVIDER; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::${name} must be set in the prod Environment."
              exit 1
            fi
          done

          if [[ "${ANDROID_RELEASE_KEY_ALIAS}" == *$'\n'* || "${ANDROID_RELEASE_KEY_ALIAS}" == *$'\r'* ]]; then
            echo "::error::ANDROID_RELEASE_KEY_ALIAS must not contain line breaks."
            exit 1
          fi

      - name: Load Android signing credentials from Vault
        id: android_signing
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ vars.VAULT_ADDR }}
          path: github-actions
          method: jwt
          role: kosmo-native-store-distribution
          jwtGithubAudience: ${{ vars.VAULT_GITHUB_ACTIONS_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/kosmo/prod/android-play ANDROID_RELEASE_KEYSTORE_BASE64 | ANDROID_RELEASE_KEYSTORE_BASE64 ;
            secret/data/kosmo/prod/android-play ANDROID_RELEASE_STORE_PASSWORD | ANDROID_RELEASE_STORE_PASSWORD ;
            secret/data/kosmo/prod/android-play ANDROID_RELEASE_KEY_PASSWORD | ANDROID_RELEASE_KEY_PASSWORD

      - name: Generate clean Expo Android project
        working-directory: apps/app
        run: |
          pnpm relay
          pnpm exec expo prebuild --clean --platform android --no-install

      - name: Restore Android upload key
        shell: bash
        env:
          ANDROID_RELEASE_KEY_PASSWORD: ${{ steps.android_signing.outputs.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ steps.android_signing.outputs.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ steps.android_signing.outputs.ANDROID_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";

            const required = (name) => {
              const value = process.env[name] ?? "";
              if (value.length === 0) throw new Error(`${name} is required.`);
              if (/\r|\n/u.test(value)) throw new Error(`${name} must not contain line breaks.`);
              return value;
            };

            const encoded = required("ANDROID_RELEASE_KEYSTORE_BASE64");
            const storePassword = required("ANDROID_RELEASE_STORE_PASSWORD");
            const keyAlias = required("ANDROID_RELEASE_KEY_ALIAS");
            const keyPassword = required("ANDROID_RELEASE_KEY_PASSWORD");
            if (!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/u.test(encoded)) {
              throw new Error("ANDROID_RELEASE_KEYSTORE_BASE64 must be a single valid base64 value.");
            }
            const keystore = Buffer.from(encoded, "base64");
            if (keystore.length === 0 || keystore.toString("base64") !== encoded) {
              throw new Error("ANDROID_RELEASE_KEYSTORE_BASE64 is invalid or empty.");
            }

            const escapeProperty = (value) => {
              let result = "";
              for (let index = 0; index < value.length; index += 1) {
                const character = value[index];
                const code = value.charCodeAt(index);
                if (character === "\\") result += "\\\\";
                else if (character === "=" || character === ":" || character === "#" || character === "!") result += `\\${character}`;
                else if (character === " " && (index === 0 || index === value.length - 1)) result += "\\ ";
                else if (code === 0x09) result += "\\t";
                else if (code === 0x0c) result += "\\f";
                else if (code < 0x20 || code > 0x7e) result += `\\u${code.toString(16).padStart(4, "0")}`;
                else result += character;
              }
              return result;
            };

            let signingDir;
            try {
              signingDir = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, "kosmo-android-signing-"));
              fs.appendFileSync(
                process.env.GITHUB_ENV,
                `KOSMO_ANDROID_SIGNING_DIR=${signingDir}\n`,
              );

              const keystorePath = path.join(signingDir, "upload.jks");
              fs.writeFileSync(keystorePath, keystore, { mode: 0o600 });

              const properties = [
                `android.injected.signing.store.file=${escapeProperty(keystorePath)}`,
                `android.injected.signing.store.password=${escapeProperty(storePassword)}`,
                `android.injected.signing.key.alias=${escapeProperty(keyAlias)}`,
                `android.injected.signing.key.password=${escapeProperty(keyPassword)}`,
              ].join("\n");
              const propertiesPath = path.join(
                process.env.GITHUB_WORKSPACE,
                "apps/app/android/gradle.properties",
              );
              fs.chmodSync(propertiesPath, 0o600);
              fs.appendFileSync(propertiesPath, `\n${properties}\n`);
            } catch (error) {
              if (signingDir) fs.rmSync(signingDir, { recursive: true, force: true });
              throw error;
            }
          '

      - name: Authenticate to Google Cloud for Play upload
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          create_credentials_file: true
          cleanup_credentials: true
          export_environment_variables: true
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Build and upload signed Alpha AAB with Fastlane
        working-directory: apps/app
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bundle exec fastlane android distribute_alpha

      - name: Write Actions summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          aab_path="${KOSMO_ANDROID_AAB_PATH}"
          test -s "${aab_path}"
          artifact_sha256="$(shasum -a 256 "${aab_path}")"
          artifact_sha256="${artifact_sha256%% *}"
          artifact_size_bytes="$(wc -c < "${aab_path}" | tr -d '[:space:]')"
          {
            echo '## Android Google Play closed testing (Alpha)'
            echo
            echo '- Package: moe.kos'
            echo "- Release status: \`${ANDROID_PLAY_RELEASE_STATUS}\`"
            echo "- Version code: \`${KOSMO_ANDROID_VERSION_CODE}\`"
            echo "- OTA channel: \`${KOSMO_OTA_CHANNEL}\`"
            echo "- OTA runtimeVersion: \`${KOSMO_OTA_RUNTIME_VERSION}\`"
            echo "- AAB SHA-256: \`${artifact_sha256}\`"
            echo "- AAB size: \`${artifact_size_bytes} bytes\`"
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove signing and generated files
        if: always()
        shell: bash
        run: |
          set +e
          rm -f -- \
            "${GOOGLE_APPLICATION_CREDENTIALS:-}" \
            "${GOOGLE_GHA_CREDS_PATH:-}"
          rm -rf -- \
            "${KOSMO_ANDROID_SIGNING_DIR:-}" \
            "${GITHUB_WORKSPACE}/apps/app/android"
  ios:
    concurrency:
      group: ios-app-store-connect-upload
      cancel-in-progress: false

    name: Build and distribute iOS App Store IPA
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    environment: prod
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      EXPO_NO_GIT_STATUS: '1'
      KOSMO_OTA_CHANNEL: prod
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_RELEASE: ${{ github.sha }}
      EXPO_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24

      - name: Set up mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: '2026.9.2'

      - name: Cache pnpm store
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        with:
          bundler-cache: true
          ruby-version: '3.4'
          working-directory: apps/app

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Set unique iOS build number
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::GITHUB_RUN_ID must be a positive integer."
            exit 1
          fi
          if [[ ! "${GITHUB_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::GITHUB_RUN_ATTEMPT must be a positive integer."
            exit 1
          fi

          # Keep a fixed three-digit attempt suffix; fail rather than collide after 999 reruns.
          attempt_number=$((10#${GITHUB_RUN_ATTEMPT}))
          if ((attempt_number > 999)); then
            echo "::error::GITHUB_RUN_ATTEMPT exceeds the three-digit iOS build number suffix limit."
            exit 1
          fi
          ios_build_number="${GITHUB_RUN_ID}$(printf '%03d' "${attempt_number}")"
          if [[ ! "${ios_build_number}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The generated iOS build number must be a positive integer."
            exit 1
          fi
          echo "IOS_BUILD_NUMBER=${ios_build_number}" >> "${GITHUB_ENV}"

      - name: Resolve iOS OTA runtime version
        working-directory: apps/app
        shell: bash
        run: |
          set -euo pipefail

          runtime_info="$(pnpm exec expo-updates runtimeversion:resolve --platform ios --workflow managed)"
          runtime_version="$(printf '%s\n' "${runtime_info}" | node --input-type=module -e 'import fs from "node:fs"; const info = JSON.parse(fs.readFileSync(0, "utf8")); process.stdout.write(typeof info.runtimeVersion === "string" ? info.runtimeVersion : "");')"
          if [[ ! "${runtime_version}" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "::error::Resolved iOS runtimeVersion must be a lowercase fingerprint hash."
            exit 1
          fi
          echo "KOSMO_OTA_RUNTIME_VERSION=${runtime_version}" >> "${GITHUB_ENV}"
          echo "Resolved iOS OTA runtimeVersion: ${runtime_version}"

      - name: Connect to Tailscale for Vault
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: tag:github-actions

      - name: Load iOS signing credentials from Vault
        id: ios_signing
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ vars.VAULT_ADDR }}
          path: github-actions
          method: jwt
          role: kosmo-native-store-distribution
          jwtGithubAudience: ${{ vars.VAULT_GITHUB_ACTIONS_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/kosmo/prod/ios-signing IOS_DISTRIBUTION_CERTIFICATE_BASE64 | IOS_DISTRIBUTION_CERTIFICATE_BASE64 ;
            secret/data/kosmo/prod/ios-signing IOS_DISTRIBUTION_CERTIFICATE_PASSWORD | IOS_DISTRIBUTION_CERTIFICATE_PASSWORD ;
            secret/data/kosmo/prod/ios-signing IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 | IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 ;
            secret/data/kosmo/prod/ios-signing APPLE_API_KEY_ID | APPLE_API_KEY_ID ;
            secret/data/kosmo/prod/ios-signing APPLE_API_ISSUER_ID | APPLE_API_ISSUER_ID ;
            secret/data/kosmo/prod/ios-signing APPLE_API_KEY_P8_BASE64 | APPLE_API_KEY_P8_BASE64

      - name: Disconnect Tailscale after loading Vault secrets
        run: |
          sudo -E tailscale logout
          networksetup -setdnsservers Ethernet Empty
          networksetup -setsearchdomains Ethernet Empty

      - name: Build and distribute iOS App Store IPA
        working-directory: apps/app
        env:
          APPLE_API_ISSUER_ID: ${{ steps.ios_signing.outputs.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ steps.ios_signing.outputs.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ steps.ios_signing.outputs.APPLE_API_KEY_P8_BASE64 }}
          IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ steps.ios_signing.outputs.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ steps.ios_signing.outputs.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ steps.ios_signing.outputs.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          CCACHE_COMPILERCHECK: content
          USE_CCACHE: '1'
          NODE_OPTIONS: '--max-old-space-size=4096'
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          # Xcode does not export custom build settings to compiler processes.
          CCACHE_BINARY="$(command -v ccache)"
          export CCACHE_BINARY
          bundle exec fastlane ios build_and_upload_ios
