name: Terraform

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/terraform.yml
      - apps/terraform/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/terraform.yml
      - apps/terraform/**

permissions:
  actions: read
  contents: read
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: terraform-kosmo-state
  cancel-in-progress: false

env:
  TF_STATE_NAMESPACE: ${{ vars.TF_STATE_NAMESPACE }}
  TF_IN_AUTOMATION: 'true'
  TF_PLAN_ARTIFACT: terraform-plan
  TF_REGISTRY_CLIENT_TIMEOUT: '60'
  TF_REGISTRY_DISCOVERY_RETRY: '3'
  TF_ROOT: apps/terraform

jobs:
  plan:
    name: Terraform Plan
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - &oci_state_auth
        name: Authenticate to OCI Object Storage
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          OCI_IDENTITY_DOMAIN_URL: ${{ vars.OCI_IDENTITY_DOMAIN_URL }}
          OCI_OIDC_CLIENT_ID: ${{ vars.OCI_OIDC_CLIENT_ID }}
          OCI_OIDC_CLIENT_SECRET: ${{ secrets.OCI_OIDC_CLIENT_SECRET }}
        with:
          script: |
            const { generateKeyPairSync } = require('node:crypto');
            const { mkdtempSync, writeFileSync } = require('node:fs');
            const { join } = require('node:path');
            const { OCI_IDENTITY_DOMAIN_URL, OCI_OIDC_CLIENT_ID, OCI_OIDC_CLIENT_SECRET, RUNNER_TEMP } = process.env;
            const domain = new URL(OCI_IDENTITY_DOMAIN_URL);
            if (domain.protocol !== 'https:' || !domain.hostname.endsWith('.identity.oraclecloud.com')) {
              throw new Error('Expected an OCI Identity Domain HTTPS URL');
            }
            const jwt = await core.getIDToken('https://github.com/byulmaru/infrastructure');
            core.setSecret(jwt);
            const { privateKey, publicKey } = generateKeyPairSync('rsa', { modulusLength: 2048 });
            const credentials = Buffer.from(`${OCI_OIDC_CLIENT_ID}:${OCI_OIDC_CLIENT_SECRET}`).toString('base64');
            core.setSecret(credentials);
            const response = await fetch(new URL('/oauth2/v1/token', domain), {
              method: 'POST',
              headers: { authorization: `Basic ${credentials}` },
              redirect: 'error',
              signal: AbortSignal.timeout(30000),
              body: new URLSearchParams({
                grant_type: 'urn:ietf:params:oauth:grant-type:token-exchange',
                requested_token_type: 'urn:oci:token-type:oci-rpst',
                subject_token_type: 'jwt',
                subject_token: jwt,
                public_key: publicKey.export({ type: 'spki', format: 'der' }).toString('base64'),
                res_type: 'githubactions',
                rpst_exp: '60',
              }),
            });
            if (!response.ok) throw new Error(`OCI token exchange failed (${response.status})`);
            const { token } = await response.json();
            if (!token) throw new Error('OCI token exchange returned no RPST');
            core.setSecret(token);
            const directory = mkdtempSync(join(RUNNER_TEMP, 'oci-rpst-'));
            const privateKeyPath = join(directory, 'private.pem');
            const tokenPath = join(directory, 'rpst');
            writeFileSync(privateKeyPath, privateKey.export({ type: 'pkcs8', format: 'pem' }), { mode: 0o600 });
            writeFileSync(tokenPath, token, { mode: 0o600 });
            core.exportVariable('OCI_RESOURCE_PRINCIPAL_VERSION', '2.2');
            core.exportVariable('OCI_RESOURCE_PRINCIPAL_RPST', tokenPath);
            core.exportVariable('OCI_RESOURCE_PRINCIPAL_PRIVATE_PEM', privateKeyPath);
            core.exportVariable('OCI_RESOURCE_PRINCIPAL_REGION', 'ap-chuncheon-1');

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: byulmaru-kosmo
          workload_identity_provider: ${{ vars.GCP_TERRAFORM_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.7'

      - name: Terraform init
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init -input=false -backend-config="namespace=${TF_STATE_NAMESPACE}"

      - name: Terraform validate
        working-directory: ${{ env.TF_ROOT }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_ROOT }}
        run: terraform plan -input=false -out=terraform.tfplan

      - name: Render Terraform plan
        working-directory: ${{ env.TF_ROOT }}
        run: |
          set -euo pipefail

          terraform show -no-color terraform.tfplan > terraform.tfplan.txt
          {
            echo "TF_PLAN_EVENT_NAME=${GITHUB_EVENT_NAME}"
            echo "TF_PLAN_COMMIT_SHA=${GITHUB_SHA}"
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "TF_PLAN_PR_NUMBER=${{ github.event.pull_request.number }}"
              echo "TF_PLAN_HEAD_SHA=${{ github.event.pull_request.head.sha }}"
            fi
          } > plan.env

          plan_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          total_lines="$(wc -l < terraform.tfplan.txt)"
          {
            echo "## Terraform plan"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Workflow run: [${GITHUB_RUN_ID}](${plan_url})"
            echo "- Apply: main will apply this saved plan with Terraform's native stale-plan validation"
            echo
            echo "<details>"
            echo "<summary>terraform show -no-color terraform.tfplan</summary>"
            echo
            echo '```terraform'
            sed -n '1,600p' terraform.tfplan.txt
            if [[ "${total_lines}" -gt 600 ]]; then
              echo "... truncated; download the artifact for the full plan ..."
            fi
            echo '```'
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Comment Terraform plan on pull request
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        working-directory: ${{ env.TF_ROOT }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          current_head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [[ "${current_head_sha}" != "${PR_HEAD_SHA}" ]]; then
            echo "Skipping comment for outdated PR head ${PR_HEAD_SHA}."
            exit 0
          fi

          marker="<!-- terraform-plan-comment -->"
          plan_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          head -c 45000 terraform.tfplan.txt > terraform.tfplan-excerpt.txt
          if [[ "$(wc -c < terraform.tfplan.txt)" -gt 45000 ]]; then
            echo "... truncated; open the workflow summary or artifact ..." >> terraform.tfplan-excerpt.txt
          fi

          {
            echo "${marker}"
            echo "## Terraform plan"
            echo
            echo "- Commit: \`${PR_HEAD_SHA}\`"
            echo "- Workflow run: [${GITHUB_RUN_ID}](${plan_url})"
            echo "- Apply: main will apply this reviewed saved plan with Terraform's native stale-plan validation"
            echo "- Artifact retention: ${GITHUB_RETENTION_DAYS} days; rerun this plan before merging if it expires"
            echo
            echo "<details open>"
            echo "<summary>terraform show -no-color terraform.tfplan</summary>"
            echo
            echo '```terraform'
            cat terraform.tfplan-excerpt.txt
            echo '```'
            echo "</details>"
          } > terraform-pr-comment.md

          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq ".[] | select(.user.type == \"Bot\" and (.body | contains(\"${marker}\"))) | .id" \
            | head -n 1)"

          if [[ -n "${comment_id}" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F body=@terraform-pr-comment.md
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@terraform-pr-comment.md
          fi

      - name: Save Terraform plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.TF_PLAN_ARTIFACT }}
          path: |
            apps/terraform/terraform.tfplan
            apps/terraform/terraform.tfplan.txt
            apps/terraform/plan.env
          if-no-files-found: error
          retention-days: ${{ github.retention_days }}

  apply:
    name: Terraform Apply
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04-arm
    environment: terraform-apply

    steps:
      - name: Validate manual ref
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Manual Terraform recovery is allowed only for refs/heads/main; got ${GITHUB_REF}." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - *oci_state_auth

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: byulmaru-kosmo
          workload_identity_provider: ${{ vars.GCP_TERRAFORM_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.7'

      - name: Terraform init
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init -input=false -backend-config="namespace=${TF_STATE_NAMESPACE}"

      - name: Download reviewed Terraform plan
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          find_plan_run() {
            local commit_sha="$1"
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${TF_PLAN_ARTIFACT}&per_page=100" \
              | jq -r "[.[].artifacts[] | select(.expired == false and .workflow_run.head_sha == \"${commit_sha}\")] | sort_by(.created_at) | last | .workflow_run.id // empty"
          }

          merged_prs="$(
            while read -r commit_sha; do
              gh api --paginate --slurp -H "Accept: application/vnd.github+json" \
                "repos/${GITHUB_REPOSITORY}/commits/${commit_sha}/pulls?per_page=100" \
                | jq -r '.[][] | select(.merged_at != null) | [.number, .head.sha] | @tsv'
            done < <(jq -r '.commits[].id' "${GITHUB_EVENT_PATH}")
          )"
          if [[ -z "${merged_prs}" ]]; then
            echo "No merged pull request is associated with this main push; refusing to apply an unreviewed plan." >&2
            exit 1
          fi

          pr_number=""
          pr_head_sha=""
          plan_run_id=""
          while IFS=$'\t' read -r candidate_pr_number candidate_head_sha; do
            candidate_plan_run_id="$(find_plan_run "${candidate_head_sha}")"
            if [[ -n "${candidate_plan_run_id}" ]]; then
              pr_number="${candidate_pr_number}"
              pr_head_sha="${candidate_head_sha}"
              plan_run_id="${candidate_plan_run_id}"
            fi
          done < <(awk '!seen[$0]++' <<< "${merged_prs}")

          if [[ -z "${plan_run_id}" ]]; then
            echo "No associated merged pull request has an unexpired Terraform plan artifact; rerun the Terraform PR plan before merging." >&2
            exit 1
          fi

          gh run download "${plan_run_id}" --name "${TF_PLAN_ARTIFACT}" --dir "${TF_ROOT}"

          plan_env() {
            awk -F= -v key="$1" '$1 == key { print substr($0, length(key) + 2); exit }' "${TF_ROOT}/plan.env"
          }

          planned_event_name="$(plan_env TF_PLAN_EVENT_NAME)"
          planned_commit_sha="$(plan_env TF_PLAN_COMMIT_SHA)"
          planned_pr_number="$(plan_env TF_PLAN_PR_NUMBER)"
          planned_head_sha="$(plan_env TF_PLAN_HEAD_SHA)"
          if [[ "${planned_event_name}" != "pull_request" || "${planned_pr_number}" != "${pr_number}" || "${planned_head_sha}" != "${pr_head_sha}" ]]; then
            echo "Downloaded plan metadata does not match PR #${pr_number} at ${pr_head_sha}." >&2
            exit 1
          fi

          {
            echo "TF_PLAN_SOURCE_EVENT=${planned_event_name}"
            echo "TF_PLAN_SOURCE_COMMIT=${planned_commit_sha}"
            echo "TF_PLAN_SOURCE_RUN_ID=${plan_run_id}"
            echo "TF_PLAN_SOURCE_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${plan_run_id}"
          } >> "${GITHUB_ENV}"

      - name: Compare reviewed and current Terraform plans
        if: ${{ github.event_name == 'push' }}
        working-directory: ${{ env.TF_ROOT }}
        run: |
          set -euo pipefail

          cleanup_plan_comparison() {
            rm -f current.tfplan current.tfplan.txt current.tfplan.json reviewed.tfplan.json
          }
          trap cleanup_plan_comparison EXIT

          normalize_plan() {
            terraform show -json "$1" \
              | jq -S '
                  {
                    configuration,
                    variables,
                    resource_changes: [
                      (.resource_changes // [])[]
                      | select(.change.actions != ["no-op"])
                    ],
                    output_changes,
                    checks
                  }
                ' > "$2"
          }

          terraform plan -input=false -out=current.tfplan
          normalize_plan terraform.tfplan reviewed.tfplan.json
          normalize_plan current.tfplan current.tfplan.json

          if ! cmp -s reviewed.tfplan.json current.tfplan.json; then
            terraform show -no-color current.tfplan > current.tfplan.txt
            {
              echo "## Terraform plan mismatch"
              echo
              echo "The current main plan differs from the reviewed plan; refusing to apply either plan."
              echo
              echo "<details>"
              echo "<summary>Current main plan</summary>"
              echo
              echo '```terraform'
              sed -n '1,600p' current.tfplan.txt
              echo '```'
              echo "</details>"
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "Current main plan differs from the reviewed pull request plan; refusing to apply." >&2
            exit 1
          fi

      - name: Summarize Terraform apply
        if: ${{ github.event_name == 'push' }}
        run: |
          {
            echo "## Terraform apply"
            echo
            echo "The current main plan matches the reviewed plan from \`${TF_PLAN_SOURCE_EVENT}\` commit \`${TF_PLAN_SOURCE_COMMIT}\`."
            echo "Applying that reviewed saved plan."
            echo "Terraform will perform its native stale-plan validation before changing infrastructure."
            echo "- Plan workflow run: [${TF_PLAN_SOURCE_RUN_ID}](${TF_PLAN_SOURCE_URL})"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Terraform apply
        working-directory: ${{ env.TF_ROOT }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            terraform apply -auto-approve
          else
            terraform apply -auto-approve terraform.tfplan
          fi
