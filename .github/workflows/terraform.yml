name: Terraform

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/terraform.yml
      - apps/terraform/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/terraform.yml
      - apps/terraform/**

permissions:
  actions: read
  contents: read
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: terraform-kosmo-state
  cancel-in-progress: false

env:
  ARGOCD_SERVER: argocd-aws.tail1fdd55.ts.net:443
  AWS_REGION: ap-northeast-2
  TF_IN_AUTOMATION: 'true'
  TF_PLAN_ARTIFACT: terraform-plan
  TF_ROOT: apps/terraform
  TF_STATE_BUCKET: byulmaru-terraform-state
  TF_STATE_KEY: kosmo/terraform.tfstate

jobs:
  plan:
    name: Terraform Plan
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: byulmaru-kosmo
          workload_identity_provider: ${{ vars.GCP_TERRAFORM_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Authenticate to Argo CD
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const githubToken = await core.getIDToken();
            core.setSecret(githubToken);

            const response = await fetch(`https://${process.env.ARGOCD_SERVER}/api/dex/token`, {
              method: "POST",
              headers: {
                authorization: `Basic ${Buffer.from("argo-cd-cli:").toString("base64")}`,
              },
              body: new URLSearchParams({
                connector_id: "github-actions",
                grant_type: "urn:ietf:params:oauth:grant-type:token-exchange",
                scope: "openid email profile federated:id",
                requested_token_type: "urn:ietf:params:oauth:token-type:access_token",
                subject_token: githubToken,
                subject_token_type: "urn:ietf:params:oauth:token-type:id_token",
              }),
            });

            if (!response.ok) {
              throw new Error(`Dex token exchange failed: ${response.status} ${await response.text()}`);
            }

            const { access_token: dexToken } = await response.json();
            if (!dexToken) {
              throw new Error("Dex token response did not include an access token.");
            }

            core.setSecret(dexToken);
            core.exportVariable("ARGOCD_AUTH_TOKEN", dexToken);

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.6'

      - name: Terraform init
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init

      - name: Terraform validate
        working-directory: ${{ env.TF_ROOT }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_ROOT }}
        run: terraform plan -input=false -out=terraform.tfplan

      - name: Render Terraform plan
        working-directory: ${{ env.TF_ROOT }}
        run: |
          set -euo pipefail

          terraform show -no-color terraform.tfplan > terraform.tfplan.txt
          {
            echo "TF_PLAN_EVENT_NAME=${GITHUB_EVENT_NAME}"
            echo "TF_PLAN_COMMIT_SHA=${GITHUB_SHA}"
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "TF_PLAN_PR_NUMBER=${{ github.event.pull_request.number }}"
              echo "TF_PLAN_HEAD_SHA=${{ github.event.pull_request.head.sha }}"
            fi
          } > plan.env

          plan_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          total_lines="$(wc -l < terraform.tfplan.txt)"
          {
            echo "## Terraform plan"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Workflow run: [${GITHUB_RUN_ID}](${plan_url})"
            echo "- Apply: main will apply this saved plan only if its current plan is equivalent"
            echo
            echo "<details>"
            echo "<summary>terraform show -no-color terraform.tfplan</summary>"
            echo
            echo '```terraform'
            sed -n '1,600p' terraform.tfplan.txt
            if [[ "${total_lines}" -gt 600 ]]; then
              echo "... truncated; download the artifact for the full plan ..."
            fi
            echo '```'
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Comment Terraform plan on pull request
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        working-directory: ${{ env.TF_ROOT }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          current_head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [[ "${current_head_sha}" != "${PR_HEAD_SHA}" ]]; then
            echo "Skipping comment for outdated PR head ${PR_HEAD_SHA}."
            exit 0
          fi

          marker="<!-- terraform-plan-comment -->"
          plan_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          head -c 45000 terraform.tfplan.txt > terraform.tfplan-excerpt.txt
          if [[ "$(wc -c < terraform.tfplan.txt)" -gt 45000 ]]; then
            echo "... truncated; open the workflow summary or artifact ..." >> terraform.tfplan-excerpt.txt
          fi

          {
            echo "${marker}"
            echo "## Terraform plan"
            echo
            echo "- Commit: \`${PR_HEAD_SHA}\`"
            echo "- Workflow run: [${GITHUB_RUN_ID}](${plan_url})"
            echo "- Apply: main will apply this reviewed saved plan only if its current plan is equivalent"
            echo "- Artifact retention: ${GITHUB_RETENTION_DAYS} days; rerun this plan before merging if it expires"
            echo
            echo "<details open>"
            echo "<summary>terraform show -no-color terraform.tfplan</summary>"
            echo
            echo '```terraform'
            cat terraform.tfplan-excerpt.txt
            echo '```'
            echo "</details>"
          } > terraform-pr-comment.md

          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq ".[] | select(.user.type == \"Bot\" and (.body | contains(\"${marker}\"))) | .id" \
            | head -n 1)"

          if [[ -n "${comment_id}" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F body=@terraform-pr-comment.md
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@terraform-pr-comment.md
          fi

      - name: Save Terraform plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.TF_PLAN_ARTIFACT }}
          path: |
            apps/terraform/terraform.tfplan
            apps/terraform/terraform.tfplan.txt
            apps/terraform/plan.env
          if-no-files-found: error
          retention-days: ${{ github.retention_days }}

  apply:
    name: Terraform Apply
    if: ${{ github.event_name == 'push' }}
    runs-on: self-hosted
    environment: terraform-apply

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: byulmaru-kosmo
          workload_identity_provider: ${{ vars.GCP_TERRAFORM_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Authenticate to Argo CD
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const githubToken = await core.getIDToken();
            core.setSecret(githubToken);

            const response = await fetch(`https://${process.env.ARGOCD_SERVER}/api/dex/token`, {
              method: "POST",
              headers: {
                authorization: `Basic ${Buffer.from("argo-cd-cli:").toString("base64")}`,
              },
              body: new URLSearchParams({
                connector_id: "github-actions",
                grant_type: "urn:ietf:params:oauth:grant-type:token-exchange",
                scope: "openid email profile federated:id",
                requested_token_type: "urn:ietf:params:oauth:token-type:access_token",
                subject_token: githubToken,
                subject_token_type: "urn:ietf:params:oauth:token-type:id_token",
              }),
            });

            if (!response.ok) {
              throw new Error(`Dex token exchange failed: ${response.status} ${await response.text()}`);
            }

            const { access_token: dexToken } = await response.json();
            if (!dexToken) {
              throw new Error("Dex token response did not include an access token.");
            }

            core.setSecret(dexToken);
            core.exportVariable("ARGOCD_AUTH_TOKEN", dexToken);

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.6'

      - name: Setup AWS CLI
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: false
          tool_versions: |
            aws-cli 2.35.14

      - name: Terraform init
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init

      - name: Download reviewed Terraform plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          find_plan_run() {
            local commit_sha="$1"
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${TF_PLAN_ARTIFACT}&per_page=100" \
              | jq -r "[.[].artifacts[] | select(.expired == false and .workflow_run.head_sha == \"${commit_sha}\")] | sort_by(.created_at) | last | .workflow_run.id // empty"
          }

          merged_prs="$(
            while read -r commit_sha; do
              gh api --paginate --slurp -H "Accept: application/vnd.github+json" \
                "repos/${GITHUB_REPOSITORY}/commits/${commit_sha}/pulls?per_page=100" \
                | jq -r '.[][] | select(.merged_at != null) | [.number, .head.sha] | @tsv'
            done < <(jq -r '.commits[].id' "${GITHUB_EVENT_PATH}")
          )"
          if [[ -z "${merged_prs}" ]]; then
            echo "No merged pull request is associated with this main push; refusing to apply an unreviewed plan." >&2
            exit 1
          fi

          pr_number=""
          pr_head_sha=""
          plan_run_id=""
          while IFS=$'\t' read -r candidate_pr_number candidate_head_sha; do
            candidate_plan_run_id="$(find_plan_run "${candidate_head_sha}")"
            if [[ -n "${candidate_plan_run_id}" ]]; then
              pr_number="${candidate_pr_number}"
              pr_head_sha="${candidate_head_sha}"
              plan_run_id="${candidate_plan_run_id}"
            fi
          done < <(sort -n -u <<< "${merged_prs}")

          if [[ -z "${plan_run_id}" ]]; then
            echo "No associated merged pull request has an unexpired Terraform plan artifact; rerun the Terraform PR plan before merging." >&2
            exit 1
          fi

          gh run download "${plan_run_id}" --name "${TF_PLAN_ARTIFACT}" --dir "${TF_ROOT}"

          plan_env() {
            awk -F= -v key="$1" '$1 == key { print substr($0, length(key) + 2); exit }' "${TF_ROOT}/plan.env"
          }

          planned_event_name="$(plan_env TF_PLAN_EVENT_NAME)"
          planned_commit_sha="$(plan_env TF_PLAN_COMMIT_SHA)"
          planned_pr_number="$(plan_env TF_PLAN_PR_NUMBER)"
          planned_head_sha="$(plan_env TF_PLAN_HEAD_SHA)"
          if [[ "${planned_event_name}" != "pull_request" || "${planned_pr_number}" != "${pr_number}" || "${planned_head_sha}" != "${pr_head_sha}" ]]; then
            echo "Downloaded plan metadata does not match PR #${pr_number} at ${pr_head_sha}." >&2
            exit 1
          fi

          {
            echo "TF_PLAN_SOURCE_EVENT=${planned_event_name}"
            echo "TF_PLAN_SOURCE_COMMIT=${planned_commit_sha}"
            echo "TF_PLAN_SOURCE_RUN_ID=${plan_run_id}"
            echo "TF_PLAN_SOURCE_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${plan_run_id}"
          } >> "${GITHUB_ENV}"

      - name: Compare reviewed and current Terraform plans
        working-directory: ${{ env.TF_ROOT }}
        run: |
          set -euo pipefail

          cleanup_plan_comparison() {
            rm -f current.tfplan current.tfplan.txt current.tfplan.json reviewed.tfplan.json
          }
          trap cleanup_plan_comparison EXIT

          terraform plan -input=false -out=current.tfplan
          terraform show -json terraform.tfplan \
            | jq -S '{configuration, variables, resource_changes: [.resource_changes[] | select(.change.actions != ["no-op"])], output_changes, checks}' \
            > reviewed.tfplan.json
          terraform show -json current.tfplan \
            | jq -S '{configuration, variables, resource_changes: [.resource_changes[] | select(.change.actions != ["no-op"])], output_changes, checks}' \
            > current.tfplan.json

          if ! cmp -s reviewed.tfplan.json current.tfplan.json; then
            terraform show -no-color current.tfplan > current.tfplan.txt
            total_lines="$(wc -l < current.tfplan.txt)"
            {
              echo "## Terraform plan mismatch"
              echo
              echo "The current main plan differs from the reviewed plan; refusing to apply either plan."
              echo
              echo "<details>"
              echo "<summary>Current main plan</summary>"
              echo
              echo '```terraform'
              sed -n '1,600p' current.tfplan.txt
              if [[ "${total_lines}" -gt 600 ]]; then
                echo "... truncated ..."
              fi
              echo '```'
              echo "</details>"
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "Current main plan differs from the reviewed pull request plan; refusing to apply." >&2
            exit 1
          fi

      - name: Summarize Terraform apply
        run: |
          {
            echo "## Terraform apply"
            echo
            echo "The current main plan is equivalent to the reviewed plan from \`${TF_PLAN_SOURCE_EVENT}\` commit \`${TF_PLAN_SOURCE_COMMIT}\`."
            echo "Applying the reviewed saved plan so Terraform retains its native stale-plan validation."
            echo "- Plan workflow run: [${TF_PLAN_SOURCE_RUN_ID}](${TF_PLAN_SOURCE_URL})"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Terraform apply saved plan
        working-directory: ${{ env.TF_ROOT }}
        run: |
          set -euo pipefail

          cleanup_lock_on_cancel() {
            status=$?
            if [[ -n "${terraform_pid:-}" ]]; then
              kill -INT "${terraform_pid}" 2>/dev/null || true
              wait "${terraform_pid}" 2>/dev/null || true
            fi
            sleep 5
            aws s3api delete-object \
              --bucket "${TF_STATE_BUCKET}" \
              --key "${TF_STATE_KEY}.tflock" || true
            exit "${status}"
          }

          trap cleanup_lock_on_cancel INT TERM
          terraform apply -auto-approve terraform.tfplan &
          terraform_pid=$!
          wait "${terraform_pid}"

      - name: Cleanup lock after cancelled apply
        if: ${{ cancelled() }}
        run: |
          aws s3api delete-object \
            --bucket "${TF_STATE_BUCKET}" \
            --key "${TF_STATE_KEY}.tflock"
