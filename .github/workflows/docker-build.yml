name: Docker Build

on:
  push:
    branches: [main]

env:
  SENTRY_RELEASE: ${{ github.sha }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker_build:
    name: Docker Build
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=main

      - name: Build runtime base
        id: runtime-base
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: runtime-base
          provenance: false
          build-args: SOURCE_DATE_EPOCH=0
          no-cache-filters: runtime-base
          outputs: type=oci,dest=${{ runner.temp }}/kosmo-runtime-base,tar=false,rewrite-timestamp=true
          cache-from: |
            type=gha,scope=docker-runtime-base
            type=gha,scope=docker-build
          cache-to: type=gha,scope=docker-runtime-base,mode=max,ignore-error=true

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-contexts: |
            runtime-base=oci-layout://${{ runner.temp }}/kosmo-runtime-base@${{ steps.runtime-base.outputs.digest }}
          cache-from: type=gha,scope=docker-build
          cache-to: type=gha,mode=max,scope=docker-build,ignore-error=true
          no-cache-filters: app-build
          build-args: |
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_RELEASE=${{ env.SENTRY_RELEASE }}
            SENTRY_UPLOAD_REQUIRED=1
          secret-envs: |
            sentry_auth_token=SENTRY_AUTH_TOKEN
