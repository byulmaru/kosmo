name: Docker Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  id-token: write
  packages: write

env:
  AWS_REGION: ap-northeast-2
  AWS_ECR_REPOSITORY_URL: 822638974464.dkr.ecr.ap-northeast-2.amazonaws.com/kosmo
  ENVIRONMENT: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
  SENTRY_RELEASE: kosmo@${{ github.sha }}
  VAULT_ADDR: https://vault.tail1fdd55.ts.net
  VAULT_GITHUB_ACTIONS_AUDIENCE: https://vault.tail1fdd55.ts.net

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker_build:
    name: Docker Build
    runs-on: [self-hosted, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          name: kosmo
          cleanup: false
          cache-binary: false

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: arn:aws:iam::822638974464:role/github-actions-kosmo-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Load Sentry build configuration from Vault
        id: sentry
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" =~ ^refs/heads/.+$ ]]; then
            vault_role="kosmo-build-dev"
          elif [[ "${GITHUB_REF}" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            vault_role="kosmo-build-prod"
          else
            echo "Sentry-enabled builds are allowed only from a branch or a semantic version tag." >&2
            exit 1
          fi

          encoded_audience="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["VAULT_GITHUB_ACTIONS_AUDIENCE"], safe=""))')"
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}"
          jwt_json="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${request_url}")"
          jwt="$(printf '%s' "${jwt_json}" | python3 -c 'import json, sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::${jwt}"

          login_payload="$(GITHUB_ACTIONS_JWT="${jwt}" VAULT_ROLE="${vault_role}" python3 -c 'import json, os; print(json.dumps({"role": os.environ["VAULT_ROLE"], "jwt": os.environ["GITHUB_ACTIONS_JWT"]}))')"
          token_json="$(printf '%s' "${login_payload}" | curl -fsSL \
            -H "Content-Type: application/json" \
            --request POST \
            --data @- \
            "${VAULT_ADDR}/v1/auth/github-actions/login")"
          vault_token="$(printf '%s' "${token_json}" | python3 -c 'import json, sys; print(json.load(sys.stdin)["auth"]["client_token"])')"
          echo "::add-mask::${vault_token}"

          sentry_json="$(curl -fsSL \
            -H "X-Vault-Token: ${vault_token}" \
            "${VAULT_ADDR}/v1/secret/data/kubernetes/kosmo/shared")"
          SENTRY_JSON="${sentry_json}" python3 - <<'PY'
          import json
          import os

          keys = (
              "EXPO_PUBLIC_SENTRY_DSN",
              "SENTRY_API_PROJECT",
              "SENTRY_AUTH_TOKEN",
              "SENTRY_ORG",
              "SENTRY_WEB_BFF_PROJECT",
              "SENTRY_WEB_PROJECT",
          )
          values = json.loads(os.environ["SENTRY_JSON"])["data"]["data"]
          missing = [key for key in keys if not values.get(key)]
          if missing:
              raise SystemExit(f"Vault Sentry build configuration is missing: {', '.join(missing)}")

          with (
              open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment,
              open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output,
          ):
              for key in keys:
                  value = values[key]
                  if not isinstance(value, str) or "\n" in value or "\r" in value:
                      raise SystemExit(f"Vault value {key} must be a single-line string")
                  print(f"::add-mask::{value}")
                  if key == "SENTRY_AUTH_TOKEN":
                      output.write(f"sentry_auth_token={value}\n")
                  else:
                      environment.write(f"{key}={value}\n")
          PY

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.AWS_ECR_REPOSITORY_URL }}
          tags: |
            type=sha
            type=ref,event=branch,prefix=branch-,enable=${{ github.ref != 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=stable,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache-filters: runtime
          build-args: |
            EXPO_PUBLIC_SENTRY_DSN=${{ env.EXPO_PUBLIC_SENTRY_DSN }}
            EXPO_PUBLIC_SENTRY_ENABLED=1
            EXPO_PUBLIC_ENVIRONMENT=${{ env.ENVIRONMENT }}
            SENTRY_API_PROJECT=${{ env.SENTRY_API_PROJECT }}
            SENTRY_ORG=${{ env.SENTRY_ORG }}
            SENTRY_RELEASE=${{ env.SENTRY_RELEASE }}
            SENTRY_UPLOAD_REQUIRED=1
            SENTRY_WEB_BFF_PROJECT=${{ env.SENTRY_WEB_BFF_PROJECT }}
            SENTRY_WEB_PROJECT=${{ env.SENTRY_WEB_PROJECT }}
          secrets: |
            sentry_auth_token=${{ steps.sentry.outputs.sentry_auth_token }}

      - name: Save Docker image reference
        shell: bash
        run: |
          echo "ghcr.io/${GITHUB_REPOSITORY}@${{ steps.build.outputs.digest }}" > docker-image-ref.txt

      - name: Upload Docker image reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image-ref
          path: docker-image-ref.txt
          retention-days: 7
