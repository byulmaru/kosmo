name: Docker Build

on:
  push:
    branches: [main, production]

env:
  AWS_REGION: ap-northeast-2
  AWS_ECR_REPOSITORY_URL: 822638974464.dkr.ecr.ap-northeast-2.amazonaws.com/kosmo
  ENVIRONMENT: ${{ github.ref == 'refs/heads/production' && 'prod' || 'dev' }}
  SENTRY_RELEASE: kosmo@${{ github.sha }}
  VAULT_ADDR: https://vault.tail1fdd55.ts.net
  VAULT_GITHUB_ACTIONS_AUDIENCE: https://vault.tail1fdd55.ts.net

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/production' }}

jobs:
  docker_build:
    name: Docker Build
    runs-on: [self-hosted, ARM64]
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      source_sha: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          name: kosmo
          cleanup: false
          cache-binary: false

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: arn:aws:iam::822638974464:role/github-actions-kosmo-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Load Sentry DSN from Vault
        id: sentry
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ env.VAULT_ADDR }}
          path: github-actions
          method: jwt
          role: ${{ github.ref == 'refs/heads/production' && 'kosmo-build-prod' || 'kosmo-build-dev' }}
          jwtGithubAudience: ${{ env.VAULT_GITHUB_ACTIONS_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/kubernetes/kosmo/${{ env.ENVIRONMENT }} EXPO_PUBLIC_SENTRY_DSN | EXPO_PUBLIC_SENTRY_DSN

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.AWS_ECR_REPOSITORY_URL }}
          tags: |
            type=sha
            type=ref,event=branch,prefix=branch-,enable=${{ github.ref != 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/production' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache-filters: |
            app-build
            runtime
          build-args: |
            EXPO_PUBLIC_ENVIRONMENT=${{ env.ENVIRONMENT }}
            EXPO_PUBLIC_OPENPANEL_CLIENT_ID=${{ github.ref == 'refs/heads/production' && vars.EXPO_PUBLIC_OPENPANEL_CLIENT_ID || '' }}
            EXPO_PUBLIC_SENTRY_DSN=${{ steps.sentry.outputs.EXPO_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_RELEASE=${{ env.SENTRY_RELEASE }}
            SENTRY_UPLOAD_REQUIRED=1
          secret-envs: |
            sentry_auth_token=SENTRY_AUTH_TOKEN

      - name: Save Docker image reference for Trivy
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: echo "ghcr.io/${GITHUB_REPOSITORY}@${{ steps.build.outputs.digest }}" > docker-image-ref.txt

      - name: Upload Docker image reference for Trivy
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image-ref
          path: docker-image-ref.txt
          retention-days: 7

  deploy_production:
    name: Deploy Production
    if: github.ref == 'refs/heads/production'
    needs: docker_build
    runs-on: self-hosted
    environment: prod
    concurrency:
      group: production-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARGOCD_SERVER: argocd-aws.tail1fdd55.ts.net
    steps:
      - name: Get Argo CD token
        id: argocd-token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const githubToken = await core.getIDToken();
            core.setSecret(githubToken);

            const response = await fetch(`https://${process.env.ARGOCD_SERVER}/api/dex/token`, {
              method: "POST",
              headers: {
                authorization: `Basic ${Buffer.from("argo-cd-cli:").toString("base64")}`,
              },
              body: new URLSearchParams({
                connector_id: "github-actions",
                grant_type: "urn:ietf:params:oauth:grant-type:token-exchange",
                scope: "openid email profile federated:id",
                requested_token_type: "urn:ietf:params:oauth:token-type:access_token",
                subject_token: githubToken,
                subject_token_type: "urn:ietf:params:oauth:token-type:id_token",
              }),
            });

            if (!response.ok) {
              throw new Error(`Dex token exchange failed: ${response.status} ${await response.text()}`);
            }

            const { access_token: dexToken } = await response.json();
            if (!dexToken) {
              throw new Error("Dex token response did not include an access token.");
            }

            core.setSecret(dexToken);
            core.setOutput("token", dexToken);

      - name: Install Argo CD CLI
        env:
          ARGOCD_CLI_VERSION: v3.4.2
        shell: bash
        run: |
          set -euo pipefail

          case "$(uname -s)" in
            Darwin) argocd_os=darwin ;;
            Linux) argocd_os=linux ;;
            *)
              echo "::error::Unsupported runner OS: $(uname -s)"
              exit 1
              ;;
          esac

          case "$(uname -m)" in
            x86_64) argocd_arch=amd64 ;;
            aarch64 | arm64) argocd_arch=arm64 ;;
            *)
              echo "::error::Unsupported runner architecture: $(uname -m)"
              exit 1
              ;;
          esac

          curl -sSfL -o "${RUNNER_TEMP}/argocd" "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_CLI_VERSION}/argocd-${argocd_os}-${argocd_arch}"
          chmod 555 "${RUNNER_TEMP}/argocd"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Deploy build digest
        env:
          ARGOCD_AUTH_TOKEN: ${{ steps.argocd-token.outputs.token }}
          IMAGE_DIGEST: ${{ needs.docker_build.outputs.image_digest }}
          SOURCE_SHA: ${{ needs.docker_build.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail

          version="${SOURCE_SHA}"
          argocd --server "${ARGOCD_SERVER}" --grpc-web app set kosmo-prod \
            --revision "${SOURCE_SHA}" \
            -p "version=${version}" \
            -p "imageDigest=${IMAGE_DIGEST}" \
            -p "workloads.enabled=true" \
            -p "migration.enabled=true" \
            --validate

          argocd --server "${ARGOCD_SERVER}" --grpc-web app sync kosmo-prod \
            --revision "${SOURCE_SHA}" \
            --prune \
            --timeout 600
          argocd --server "${ARGOCD_SERVER}" --grpc-web app wait kosmo-prod \
            --sync \
            --health \
            --timeout 600

          actual_source_revision="$(argocd --server "${ARGOCD_SERVER}" --grpc-web app get kosmo-prod --output json | jq -r '.status.sync.revision')"
          if [[ "${actual_source_revision}" != "${SOURCE_SHA}" ]]; then
            echo "::error::Argo CD synced revision ${actual_source_revision}, expected ${SOURCE_SHA}."
            exit 1
          fi

      - name: Record production deployment
        if: always()
        env:
          IMAGE_DIGEST: ${{ needs.docker_build.outputs.image_digest }}
          SOURCE_SHA: ${{ needs.docker_build.outputs.source_sha }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "### Production deployment ${GITHUB_REF_NAME}"
            echo
            echo "- Requester: ${GITHUB_ACTOR}"
            echo "- Approval boundary: production branch ruleset"
            echo "- Commit: ${SOURCE_SHA}"
            echo "- Helm source revision: ${SOURCE_SHA}"
            echo "- Image identity: ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}"
            echo "- Result: ${RESULT}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
          } >> "${GITHUB_STEP_SUMMARY}"
