name: Expo OTA Export

on:
  workflow_call:
    inputs:
      channel:
        description: OTA channel used for export concurrency
        required: true
        type: string
      platform:
        description: Native platform to export
        required: true
        type: string
      source_sha:
        description: Full 40-character source SHA to export
        required: true
        type: string
    secrets:
      SENTRY_AUTH_TOKEN:
        description: Sentry token authorized to upload Expo source maps
        required: true
    outputs:
      artifact_name:
        description: Uploaded export artifact name
        value: ${{ jobs.export.outputs.artifact_name }}
      runtime_version:
        description: Resolved Expo runtime version
        value: ${{ jobs.export.outputs.runtime_version }}

permissions:
  actions: read
  contents: read

jobs:
  export:
    name: Export approved ${{ inputs.platform }} update
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: expo-ota-export-${{ inputs.platform }}-${{ inputs.channel }}-${{ inputs.source_sha }}
      cancel-in-progress: false
    outputs:
      artifact_name: ${{ steps.export.outputs.artifact_name }}
      runtime_version: ${{ steps.export.outputs.runtime_version }}
    env:
      EXPO_NO_GIT_STATUS: '1'
      EXPO_PUBLIC_SENTRY_RELEASE: ${{ inputs.source_sha }}
    steps:
      - name: Checkout approved source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Set up mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: '2026.9.2'

      - name: Cache pnpm store
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Export ${{ inputs.platform }} update
        id: export
        working-directory: apps/app
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail

          runtime_version="$(
            pnpm exec expo-updates runtimeversion:resolve --platform "${PLATFORM}" \
              | jq -er '.runtimeVersion'
          )"
          if [[ ! "${runtime_version}" =~ ^[A-Za-z0-9._-]+$ || "${runtime_version}" == "." || "${runtime_version}" == ".." ]]; then
            echo "::error::Resolved Expo runtimeVersion must be a safe non-empty path segment."
            exit 1
          fi
          pnpm exec expo export \
            --clear \
            --platform "${PLATFORM}" \
            --source-maps external \
            --output-dir ".artifacts/${PLATFORM}"
          expo_client_path=".artifacts/${PLATFORM}/expo-client.json"
          pnpm exec expo config --type public --json > "${expo_client_path}"
          if ! jq -e '
            .scheme == "kosmo" and
            .ios.bundleIdentifier == "moe.kos" and
            .android.package == "moe.kos"
          ' "${expo_client_path}" >/dev/null; then
            echo "::error::Public Expo config must include the Kosmo scheme and native platform identifiers."
            exit 1
          fi
          echo "artifact_name=expo-ota-${PLATFORM}-${GITHUB_RUN_ID}-export" >> "${GITHUB_OUTPUT}"
          echo "runtime_version=${runtime_version}" >> "${GITHUB_OUTPUT}"

      - name: Upload ${{ inputs.platform }} export
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          if-no-files-found: error
          include-hidden-files: true
          name: ${{ steps.export.outputs.artifact_name }}
          path: apps/app/.artifacts/${{ inputs.platform }}
          retention-days: 90

      - name: Upload source maps to Sentry
        working-directory: apps/app
        shell: bash
        env:
          EXPORT_DIRECTORY: .artifacts/${{ inputs.platform }}
          PLATFORM: ${{ inputs.platform }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ inputs.source_sha }}
          SENTRY_URL: https://sentry.io/
        run: |
          set -euo pipefail

          : "${SENTRY_AUTH_TOKEN:?SENTRY_AUTH_TOKEN must be configured}"
          : "${SENTRY_ORG:?SENTRY_ORG must be configured}"
          : "${SENTRY_PROJECT:?SENTRY_PROJECT must be configured}"
          if [[ ! "${SENTRY_RELEASE}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::SENTRY_RELEASE must be the full source SHA."
            exit 1
          fi

          bundle_path="$(jq -er --arg platform "${PLATFORM}" '.fileMetadata[$platform].bundle' "${EXPORT_DIRECTORY}/metadata.json")"
          test -s "${EXPORT_DIRECTORY}/${bundle_path}"
          test -s "${EXPORT_DIRECTORY}/${bundle_path}.map"
          bundle_directory="$(dirname "${EXPORT_DIRECTORY}/${bundle_path}")"
          pnpm dlx @sentry/expo-upload-sourcemaps@8.24.0 "${bundle_directory}"
