name: Expo OTA Release

on:
  workflow_call:
    inputs:
      channel:
        description: OTA channel to publish
        required: true
        type: string
      source_sha:
        description: Full 40-character source SHA to export
        required: true
        type: string
      keyid:
        description: Expo Updates signing key identifier
        required: false
        type: string
        default: 2026-09

permissions:
  actions: read
  contents: read

jobs:
  validate:
    name: Validate automatic OTA release
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tuple
        env:
          CHANNEL: ${{ inputs.channel }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          KEYID: ${{ inputs.keyid }}
          PUBLIC_BASE_URL: ${{ vars.EXPO_OTA_PUBLIC_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${CHANNEL}" =~ ^[A-Za-z0-9._-]+$ || "${CHANNEL}" == '.' || "${CHANNEL}" == '..' ]]; then
            echo "::error::channel must be a safe path segment."
            exit 1
          fi
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::source_sha must be an exact 40-character commit SHA."
            exit 1
          fi
          if [[ ! "${KEYID}" =~ ^[A-Za-z0-9._-]+$ || "${KEYID}" == '.' || "${KEYID}" == '..' ]]; then
            echo "::error::keyid must be a safe signing-key path segment."
            exit 1
          fi
          if [[ -z "${PUBLIC_BASE_URL}" ]]; then
            echo "::error::EXPO_OTA_PUBLIC_BASE_URL must be configured for OTA verification."
            exit 1
          fi

  export:
    name: Export approved Expo updates
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: expo-ota-export-${{ inputs.channel }}-${{ inputs.source_sha }}
      cancel-in-progress: false
    outputs:
      android_artifact_name: ${{ steps.export.outputs.android_artifact_name }}
      android_runtime_version: ${{ steps.export.outputs.android_runtime_version }}
      ios_artifact_name: ${{ steps.export.outputs.ios_artifact_name }}
      ios_runtime_version: ${{ steps.export.outputs.ios_runtime_version }}
    env:
      EXPO_NO_GIT_STATUS: '1'
    steps:
      - name: Checkout approved source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Set up mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: '2026.9.2'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Export Android and iOS updates
        id: export
        working-directory: apps/app
        env:
          CHANNEL: ${{ inputs.channel }}
          KEYID: ${{ inputs.keyid }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .artifacts
          mkdir -p .artifacts/android .artifacts/ios
          for platform in android ios; do
            output_dir="${RUNNER_TEMP}/kosmo-expo-ota-${platform}"
            rm -rf "${output_dir}"
            node --import tsx scripts/export-ota.ts export \
              --platform "${platform}" \
              --channel "${CHANNEL}" \
              --source-sha "${SOURCE_SHA}" \
              --keyid "${KEYID}" \
              --output-dir "${output_dir}"
            runtime_version="$(jq -er '.runtimeVersion' "${output_dir}/provenance.json")"
            artifact_name="expo-ota-${platform}-${GITHUB_RUN_ID}-export"
            cp -R "${output_dir}/." ".artifacts/${platform}/"
            echo "${platform}_artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
            echo "${platform}_runtime_version=${runtime_version}" >> "${GITHUB_OUTPUT}"
          done

      - name: Upload Android export
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          if-no-files-found: error
          include-hidden-files: true
          name: ${{ steps.export.outputs.android_artifact_name }}
          path: apps/app/.artifacts/android
          retention-days: 90

      - name: Upload iOS export
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          if-no-files-found: error
          include-hidden-files: true
          name: ${{ steps.export.outputs.ios_artifact_name }}
          path: apps/app/.artifacts/ios
          retention-days: 90

  publish_android:
    name: Publish Android ${{ inputs.channel }} OTA
    needs: export
    if: github.repository_owner_id == '29172280'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: expo-ota-kosmo-native-android-${{ inputs.channel }}-${{ needs.export.outputs.android_runtime_version }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download approved Android export
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: ${{ needs.export.outputs.android_artifact_name }}
          path: .artifacts/expo-export

      - name: Connect to Tailscale for Vault
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: tag:github-actions

      - name: Read R2 credentials and signing key from Vault
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ vars.VAULT_ADDR }}
          path: github-actions
          method: jwt
          role: kosmo-expo-ota-publish
          jwtGithubAudience: ${{ vars.VAULT_ADDR }}
          exportEnv: false
          secrets: |
            secret/data/expo-ota/r2 access_key_id | R2_ACCESS_KEY_ID ;
            secret/data/expo-ota/r2 secret_access_key | R2_SECRET_ACCESS_KEY ;
            secret/data/expo-ota/signing/kosmo-native/${{ inputs.keyid }} private_key | SIGNING_PRIVATE_KEY

      - name: Publish Android Expo OTA update
        uses: byulmaru/expo-ota@d3ca0cd3a2bd6687be9e156b432e1b55d6a47b78 # PR6
        with:
          export-dir: .artifacts/expo-export
          project: kosmo-native
          platform: android
          channel: ${{ inputs.channel }}
          runtime-version: ${{ needs.export.outputs.android_runtime_version }}
          public-base-url: ${{ vars.EXPO_OTA_PUBLIC_BASE_URL }}
          r2-bucket: ${{ vars.EXPO_OTA_R2_BUCKET }}
          r2-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          r2-access-key-id: ${{ steps.vault.outputs.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ steps.vault.outputs.R2_SECRET_ACCESS_KEY }}
          signing-private-key: ${{ steps.vault.outputs.SIGNING_PRIVATE_KEY }}
          keyid: ${{ inputs.keyid }}

  publish_ios:
    name: Publish iOS ${{ inputs.channel }} OTA
    needs: export
    if: github.repository_owner_id == '29172280'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: expo-ota-kosmo-native-ios-${{ inputs.channel }}-${{ needs.export.outputs.ios_runtime_version }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download approved iOS export
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: ${{ needs.export.outputs.ios_artifact_name }}
          path: .artifacts/expo-export

      - name: Connect to Tailscale for Vault
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: tag:github-actions

      - name: Read R2 credentials and signing key from Vault
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ vars.VAULT_ADDR }}
          path: github-actions
          method: jwt
          role: kosmo-expo-ota-publish
          jwtGithubAudience: ${{ vars.VAULT_ADDR }}
          exportEnv: false
          secrets: |
            secret/data/expo-ota/r2 access_key_id | R2_ACCESS_KEY_ID ;
            secret/data/expo-ota/r2 secret_access_key | R2_SECRET_ACCESS_KEY ;
            secret/data/expo-ota/signing/kosmo-native/${{ inputs.keyid }} private_key | SIGNING_PRIVATE_KEY

      - name: Publish iOS Expo OTA update
        uses: byulmaru/expo-ota@d3ca0cd3a2bd6687be9e156b432e1b55d6a47b78 # PR6
        with:
          export-dir: .artifacts/expo-export
          project: kosmo-native
          platform: ios
          channel: ${{ inputs.channel }}
          runtime-version: ${{ needs.export.outputs.ios_runtime_version }}
          public-base-url: ${{ vars.EXPO_OTA_PUBLIC_BASE_URL }}
          r2-bucket: ${{ vars.EXPO_OTA_R2_BUCKET }}
          r2-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          r2-access-key-id: ${{ steps.vault.outputs.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ steps.vault.outputs.R2_SECRET_ACCESS_KEY }}
          signing-private-key: ${{ steps.vault.outputs.SIGNING_PRIVATE_KEY }}
          keyid: ${{ inputs.keyid }}

  verify:
    name: Verify ${{ matrix.platform }} ${{ inputs.channel }} OTA
    needs: [export, publish_android, publish_ios]
    if: >-
      needs.publish_android.result == 'success' &&
      needs.publish_ios.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    env:
      PUBLIC_BASE_URL: ${{ vars.EXPO_OTA_PUBLIC_BASE_URL }}
    steps:
      - name: Checkout verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: '2026.9.2'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Download published export
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: ${{ matrix.platform == 'android' && needs.export.outputs.android_artifact_name || needs.export.outputs.ios_artifact_name }}
          path: .artifacts/export

      - name: Verify published update
        working-directory: apps/app
        env:
          CHANNEL: ${{ inputs.channel }}
          KEYID: ${{ inputs.keyid }}
          RUNTIME_VERSION: ${{ matrix.platform == 'android' && needs.export.outputs.android_runtime_version || needs.export.outputs.ios_runtime_version }}
        shell: bash
        run: |
          set -euo pipefail

          node --import tsx scripts/export-ota.ts verify \
            --platform "${{ matrix.platform }}" \
            --channel "${CHANNEL}" \
            --keyid "${KEYID}" \
            --runtime-version "${RUNTIME_VERSION}" \
            --public-base-url "${PUBLIC_BASE_URL}" \
            --output-dir "${GITHUB_WORKSPACE}/.artifacts/export"
