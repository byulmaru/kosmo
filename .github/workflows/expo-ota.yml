name: Expo OTA Export

on:
  workflow_call:
    inputs:
      channel:
        description: OTA channel used for export concurrency
        required: true
        type: string
      platform:
        description: Native platform to export
        required: true
        type: string
      source_sha:
        description: Full 40-character source SHA to export
        required: true
        type: string
    outputs:
      artifact_name:
        description: Uploaded export artifact name
        value: ${{ jobs.export.outputs.artifact_name }}
      runtime_version:
        description: Resolved Expo runtime version
        value: ${{ jobs.export.outputs.runtime_version }}

permissions:
  actions: read
  contents: read

jobs:
  export:
    name: Export approved ${{ inputs.platform }} update
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: expo-ota-export-${{ inputs.platform }}-${{ inputs.channel }}-${{ inputs.source_sha }}
      cancel-in-progress: false
    outputs:
      artifact_name: ${{ steps.export.outputs.artifact_name }}
      runtime_version: ${{ steps.export.outputs.runtime_version }}
    env:
      EXPO_NO_GIT_STATUS: '1'
    steps:
      - name: Checkout approved source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Set up mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: '2026.9.2'

      - name: Cache pnpm store
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Export ${{ inputs.platform }} update
        id: export
        working-directory: apps/app
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail

          runtime_version="$(
            pnpm exec expo-updates runtimeversion:resolve --platform "${PLATFORM}" \
              | jq -er '.runtimeVersion'
          )"
          pnpm exec expo export \
            --clear \
            --platform "${PLATFORM}" \
            --output-dir ".artifacts/${PLATFORM}"
          echo "artifact_name=expo-ota-${PLATFORM}-${GITHUB_RUN_ID}-export" >> "${GITHUB_OUTPUT}"
          echo "runtime_version=${runtime_version}" >> "${GITHUB_OUTPUT}"

      - name: Upload ${{ inputs.platform }} export
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          if-no-files-found: error
          include-hidden-files: true
          name: ${{ steps.export.outputs.artifact_name }}
          path: apps/app/.artifacts/${{ inputs.platform }}
          retention-days: 90
