name: Expo OTA Export

on:
  workflow_call:
    inputs:
      channel:
        description: OTA channel used for export concurrency
        required: true
        type: string
      platform:
        description: Native platform to export
        required: true
        type: string
      source_sha:
        description: Full 40-character source SHA to export
        required: true
        type: string
    secrets:
      SENTRY_AUTH_TOKEN:
        description: Sentry token authorized to upload Expo source maps
        required: true
    outputs:
      artifact_name:
        description: Uploaded export artifact name
        value: ${{ jobs.export.outputs.artifact_name }}
      runtime_version:
        description: Resolved Expo runtime version
        value: ${{ jobs.export.outputs.runtime_version }}

permissions:
  actions: read
  contents: read

jobs:
  export:
    name: Export approved ${{ inputs.platform }} update
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: expo-ota-export-${{ inputs.platform }}-${{ inputs.channel }}-${{ inputs.source_sha }}
      cancel-in-progress: false
    outputs:
      artifact_name: ${{ steps.export.outputs.artifact_name }}
      runtime_version: ${{ steps.export.outputs.runtime_version }}
    env:
      EXPO_NO_GIT_STATUS: '1'
      EXPO_PUBLIC_SENTRY_RELEASE: ${{ inputs.source_sha }}
    steps:
      - name: Checkout approved source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Set up mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: '2026.9.2'

      - name: Cache pnpm store
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Export ${{ inputs.platform }} update
        id: export
        working-directory: apps/app
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail

          runtime_version="$(
            pnpm exec expo-updates runtimeversion:resolve --platform "${PLATFORM}" \
              | jq -er '.runtimeVersion'
          )"
          if [[ ! "${runtime_version}" =~ ^[A-Za-z0-9._-]+$ || "${runtime_version}" == "." || "${runtime_version}" == ".." ]]; then
            echo "::error::Resolved Expo runtimeVersion must be a safe non-empty path segment."
            exit 1
          fi
          pnpm exec expo export \
            --clear \
            --platform "${PLATFORM}" \
            --source-maps external \
            --output-dir ".artifacts/${PLATFORM}"
          expo_client_path=".artifacts/${PLATFORM}/expo-client.json"
          pnpm exec expo config --type public --json > "${expo_client_path}"
          if ! jq -e '
            .scheme == "kosmo" and
            .ios.bundleIdentifier == "moe.kos" and
            .android.package == "moe.kos"
          ' "${expo_client_path}" >/dev/null; then
            echo "::error::Public Expo config must include the Kosmo scheme and native platform identifiers."
            exit 1
          fi
          node "$GITHUB_WORKSPACE/scripts/prepare-expo-ota-sourcemaps.mjs" \
            ".artifacts/${PLATFORM}" \
            "${RUNNER_TEMP}/kosmo-ota-sourcemaps-${PLATFORM}"
          echo "artifact_name=expo-ota-${PLATFORM}-${GITHUB_RUN_ID}-export" >> "${GITHUB_OUTPUT}"
          echo "runtime_version=${runtime_version}" >> "${GITHUB_OUTPUT}"

      - name: Upload private ${{ inputs.platform }} source maps
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          if-no-files-found: error
          include-hidden-files: true
          name: expo-ota-${{ inputs.platform }}-${{ github.run_id }}-sourcemaps
          path: ${{ runner.temp }}/kosmo-ota-sourcemaps-${{ inputs.platform }}
          retention-days: 1

      - name: Upload ${{ inputs.platform }} export
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          if-no-files-found: error
          include-hidden-files: true
          name: ${{ steps.export.outputs.artifact_name }}
          path: apps/app/.artifacts/${{ inputs.platform }}
          retention-days: 90

  upload_sourcemaps:
    name: Upload ${{ inputs.platform }} source maps to Sentry
    needs: export
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
    env:
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_RELEASE: ${{ inputs.source_sha }}
      SENTRY_URL: https://sentry.io/
    steps:
      - name: Download private source map upload artifact
        uses: actions/download-artifact@0d2ec9d4cbcefe257d822f108de2a1f15f8da9f6 # v7.0.0
        with:
          name: expo-ota-${{ inputs.platform }}-${{ github.run_id }}-sourcemaps
          path: ${{ runner.temp }}/kosmo-ota-upload

      - name: Validate Sentry upload configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in SENTRY_ORG SENTRY_PROJECT SENTRY_RELEASE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} must be configured before Expo source maps can be uploaded."
              exit 1
            fi
          done
          if [[ ! "${SENTRY_RELEASE}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::SENTRY_RELEASE must be the full source SHA."
            exit 1
          fi

      - name: Validate every source map pair before token exposure
        shell: bash
        env:
          UPLOAD_DIR: ${{ runner.temp }}/kosmo-ota-upload
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { lstat, readFile, readdir } from 'node:fs/promises';
          import path from 'node:path';

          const root = path.resolve(process.env.UPLOAD_DIR);
          const walkFiles = async (directory) => {
            const entries = await readdir(directory, { withFileTypes: true });
            const files = [];
            for (const entry of entries) {
              const filePath = path.join(directory, entry.name);
              const metadata = await lstat(filePath);
              if (metadata.isSymbolicLink()) {
                throw new Error(`Source map upload artifact contains a symbolic link: ${filePath}`);
              }
              if (metadata.isDirectory()) {
                files.push(...(await walkFiles(filePath)));
              } else if (metadata.isFile()) {
                files.push(filePath);
              } else {
                throw new Error(`Unsupported source map artifact entry: ${filePath}`);
              }
            }
            return files;
          };

          const files = await walkFiles(root);
          const bundles = files.filter((filePath) => /\.(?:js|hbc)$/.test(filePath));
          const maps = files.filter((filePath) => filePath.endsWith('.map'));
          if (bundles.length === 0) {
            throw new Error(`No JavaScript or Hermes bundles found in ${root}`);
          }
          const expectedMaps = new Set(bundles.map((bundle) => `${bundle}.map`));
          for (const bundle of bundles) {
            const mapPath = `${bundle}.map`;
            if (!files.includes(mapPath)) {
              throw new Error(`Bundle is missing its source map: ${bundle}`);
            }
            const sourceMap = JSON.parse(await readFile(mapPath, 'utf8'));
            if (
              !Array.isArray(sourceMap.sources) ||
              sourceMap.sources.length === 0 ||
              !Array.isArray(sourceMap.sourcesContent) ||
              sourceMap.sourcesContent.length === 0 ||
              !sourceMap.sourcesContent.some((source) => typeof source === 'string' && source.length > 0)
            ) {
              throw new Error(`Source map lacks source paths or embedded content: ${mapPath}`);
            }
            if (bundle.endsWith('.js')) {
              const contents = await readFile(bundle, 'utf8');
              if (/^[\t ]*\/\/[#@][\t ]*sourceMappingURL\s*=/m.test(contents)) {
                throw new Error(`Source map reference remains in uploaded bundle: ${bundle}`);
              }
            } else if (
              /(?:^|[\r\n])\/\/[#@][\t ]*sourceMappingURL\s*=/.test(
                (await readFile(bundle)).subarray(-1024).toString('latin1'),
              )
            ) {
              throw new Error(`Source map reference remains in uploaded Hermes bundle: ${bundle}`);
            }
          }
          for (const mapPath of maps) {
            if (!expectedMaps.has(mapPath)) {
              throw new Error(`Source map has no matching bundle: ${mapPath}`);
            }
          }
          NODE

      - name: Set up Node.js for isolated source map upload
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Set up pnpm for isolated source map upload
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.22.0
          run_install: false

      - name: Install the pinned Sentry Expo uploader without credentials
        shell: bash
        run: |
          set -euo pipefail
          uploader_directory="${RUNNER_TEMP}/kosmo-sentry-uploader"
          mkdir -p "${uploader_directory}"
          cat > "${uploader_directory}/package.json" <<'JSON'
          {
            "name": "kosmo-sentry-uploader",
            "private": true,
            "version": "1.0.0",
            "packageManager": "pnpm@11.22.0"
          }
          JSON
          pnpm --dir "${uploader_directory}" add --save-exact \
            @sentry/expo-upload-sourcemaps@8.24.0

      - name: Upload source maps to Sentry
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SENTRY_AUTH_TOKEN}" ]]; then
            echo "::error::SENTRY_AUTH_TOKEN must be configured to upload Expo source maps."
            exit 1
          fi
          node "${RUNNER_TEMP}/kosmo-sentry-uploader/node_modules/@sentry/expo-upload-sourcemaps/cli.js" \
            "${RUNNER_TEMP}/kosmo-ota-upload"
