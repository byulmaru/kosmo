name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable SemVer GitHub Release tag to deploy or roll back to
        required: true
        type: string

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  deploy_production:
    name: Approve and Deploy Production
    runs-on: self-hosted
    environment: production
    permissions:
      attestations: read
      contents: read
      id-token: write
    env:
      ARGOCD_SERVER: argocd-aws.tail1fdd55.ts.net
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          image_ref="$(scripts/resolve-production-release.sh "${RELEASE_TAG}")"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"

      - name: Get Argo CD token
        id: argocd-token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const githubToken = await core.getIDToken();
            core.setSecret(githubToken);

            const response = await fetch(`https://${process.env.ARGOCD_SERVER}/api/dex/token`, {
              method: "POST",
              headers: {
                authorization: `Basic ${Buffer.from("argo-cd-cli:").toString("base64")}`,
              },
              body: new URLSearchParams({
                connector_id: "github-actions",
                grant_type: "urn:ietf:params:oauth:grant-type:token-exchange",
                scope: "openid email profile federated:id",
                requested_token_type: "urn:ietf:params:oauth:token-type:access_token",
                subject_token: githubToken,
                subject_token_type: "urn:ietf:params:oauth:token-type:id_token",
              }),
            });

            if (!response.ok) {
              throw new Error(`Dex token exchange failed: ${response.status} ${await response.text()}`);
            }

            const { access_token: dexToken } = await response.json();
            if (!dexToken) {
              throw new Error("Dex token response did not include an access token.");
            }

            core.setSecret(dexToken);
            core.setOutput("token", dexToken);

      - name: Install Argo CD CLI
        env:
          ARGOCD_CLI_VERSION: v3.4.2
        shell: bash
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64) argocd_arch=amd64 ;;
            aarch64 | arm64) argocd_arch=arm64 ;;
            *)
              echo "::error::Unsupported runner architecture: $(uname -m)"
              exit 1
              ;;
          esac

          curl -sSfL -o "${RUNNER_TEMP}/argocd" "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_CLI_VERSION}/argocd-darwin-${argocd_arch}"
          chmod 555 "${RUNNER_TEMP}/argocd"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Deploy verified release
        env:
          ARGOCD_AUTH_TOKEN: ${{ steps.argocd-token.outputs.token }}
          IMAGE_REF: ${{ steps.release.outputs.image_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          digest="${IMAGE_REF#*@}"
          argocd --server "${ARGOCD_SERVER}" --grpc-web app set kosmo-prod \
            -p "version=${RELEASE_TAG}" \
            -p "imageDigest=${digest}" \
            -p "migration.enabled=true" \
            --validate

          manifests="${RUNNER_TEMP}/kosmo-prod.yaml"
          argocd --server "${ARGOCD_SERVER}" --grpc-web app manifests kosmo-prod --source git > "${manifests}"

          kosmo_images="$(
            sed -En "s/^[[:space:]]*-?[[:space:]]*image:[[:space:]]*['\"]?([^'\"[:space:]]+)['\"]?[[:space:]]*$/\1/p" "${manifests}" \
              | grep -E '^ghcr\.io/byulmaru/kosmo(@|:)' \
              || true
          )"
          expected_images="$(grep -Fxc "${IMAGE_REF}" <<<"${kosmo_images}" || true)"
          kosmo_image_count="$(grep -c . <<<"${kosmo_images}" || true)"
          presync_jobs="$(grep -Ec "argocd\.argoproj\.io/hook: ['\"]?PreSync" "${manifests}" || true)"
          if [[ "${expected_images}" -ne 3 || "${kosmo_image_count}" -ne 3 || "${presync_jobs}" -ne 1 ]]; then
            echo "::error::Production migration, API, and Web must use ${IMAGE_REF} with one PreSync migration job."
            exit 1
          fi

          argocd --server "${ARGOCD_SERVER}" --grpc-web app sync kosmo-prod --timeout 600

      - name: Record production release audit
        if: always()
        env:
          IMAGE_REF: ${{ steps.release.outputs.image_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "### Production release ${RELEASE_TAG}"
            echo
            echo "- Requester: ${GITHUB_ACTOR}"
            echo "- Approval gate: production environment"
            echo "- Release tag: ${RELEASE_TAG}"
            echo "- Image identity: ${IMAGE_REF:-unresolved}"
            echo "- Result: ${RESULT}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
          } >> "${GITHUB_STEP_SUMMARY}"
