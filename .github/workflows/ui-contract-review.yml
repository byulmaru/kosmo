name: UI Contract Review

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  ui-contract-review:
    name: UI Contract Review (advisory)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      outcome: ${{ steps.summary.outputs.outcome }}
      report: ${{ steps.summary.outputs.report }}
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up mise
        id: mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: '2026.9.2'

      - name: Install dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile

      - name: Run UI contract review
        id: check
        env:
          UI_CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          UI_CONTRACT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          UI_CONTRACT_LOG: ${{ runner.temp }}/ui-contract-review.log
          UI_CONTRACT_RESULT: ${{ runner.temp }}/ui-contract-review-result.json
        run: |
          set -euo pipefail
          UI_CONTRACT_CHECKER="scripts/check-ui-contract-pr.mjs"
          UI_CONTRACT_TEMP=""
          UI_CONTRACT_BOOTSTRAP=0
          trap 'if [ -n "$UI_CONTRACT_TEMP" ]; then rm -f "$UI_CONTRACT_TEMP"; fi' EXIT

          if git cat-file -e "$UI_CONTRACT_BASE_SHA:scripts/check-ui-contract-pr.mjs" 2>/dev/null; then
            UI_CONTRACT_TEMP="$(mktemp scripts/.check-ui-contract-pr.base.XXXXXX.mjs)"
            git show "$UI_CONTRACT_BASE_SHA:scripts/check-ui-contract-pr.mjs" > "$UI_CONTRACT_TEMP"
            UI_CONTRACT_CHECKER="$UI_CONTRACT_TEMP"
          else
            UI_CONTRACT_BOOTSTRAP=1
          fi

          export UI_CONTRACT_BOOTSTRAP UI_CONTRACT_CHECKER
          node --input-type=module <<'NODE' 2>&1 | tee "$UI_CONTRACT_LOG"
          import { readFileSync, writeFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';

          try {
            const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
            const { checkPullRequest } = await import(
              pathToFileURL(process.env.UI_CONTRACT_CHECKER).href
            );
            const result = checkPullRequest({
              base: process.env.UI_CONTRACT_BASE_SHA,
              bootstrap: process.env.UI_CONTRACT_BOOTSTRAP === '1',
              cwd: process.env.GITHUB_WORKSPACE,
              head: process.env.UI_CONTRACT_HEAD_SHA,
              prBody: event.pull_request?.body,
            });
            // shortcut: filter legacy global policy/UI boundary errors; remove when old base checkers no longer emit them.
            const reviewNotes = Array.isArray(result.reviewNotes) ? [...result.reviewNotes] : [];
            const legacyUiMix = result.errors.find((error) =>
              error.startsWith('The PR mixes UI contract changes with feature changes;'),
            );
            if (legacyUiMix) {
              const categoryFiles =
                result.categoryFiles && typeof result.categoryFiles === 'object'
                  ? result.categoryFiles
                  : undefined;
              const uiFiles = Array.isArray(categoryFiles?.ui) ? categoryFiles.ui : [];
              const featureFiles = Array.isArray(categoryFiles?.feature)
                ? categoryFiles.feature
                : [];
              reviewNotes.push(
                uiFiles.length > 0 || featureFiles.length > 0
                  ? [
                      '이전 checker의 UI/기능 혼합 참고:',
                      ...(uiFiles.length > 0 ? ['UI 계약 근거:', ...uiFiles.map((file) => `    ${file}`)] : []),
                      ...(featureFiles.length > 0 ? ['기능/runtime 근거:', ...featureFiles.map((file) => `    ${file}`)] : []),
                      '기존 component/recipe 재사용 여부와 새 variant/public visual prop의 근거를 리뷰하세요. 이 근거만으로 PR 분리를 요구하지 않습니다.',
                    ].join('\n')
                  : '이전 checker가 UI/기능 혼합의 파일별 근거를 제공하지 않습니다. 기존 component/recipe 재사용 여부와 새 variant/public visual prop의 근거를 리뷰하세요. 이 근거만으로 PR 분리를 요구하지 않습니다.',
              );
            }
            const filteredErrors = result.errors.filter(
              (error) =>
                !error.startsWith('The PR mixes UI contract changes with feature changes;') &&
                !error.startsWith(
                  'The PR mixes enforcement-policy changes with runtime UI or feature changes;',
                ),
            );
            const report = { errors: filteredErrors, reviewNotes };
            writeFileSync(process.env.UI_CONTRACT_RESULT, JSON.stringify(report));
            if (filteredErrors.length > 0) {
              console.error(`UI contract PR check failed: ${filteredErrors.join('\n')}`);
              process.exitCode = 1;
            } else {
              console.log('UI contract PR check passed.');
            }
          } catch (error) {
            console.error(
              `UI contract PR check failed: ${error instanceof Error ? error.message : String(error)}`,
            );
            process.exitCode = 1;
          }
          NODE

      - name: Summarize UI contract review
        id: summary
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          UI_CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          UI_CONTRACT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UI_CONTRACT_LOG: ${{ runner.temp }}/ui-contract-review.log
          UI_CONTRACT_RESULT: ${{ runner.temp }}/ui-contract-review-result.json
          UI_CONTRACT_CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          UI_CONTRACT_DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          UI_CONTRACT_CHECK_OUTCOME: ${{ steps.check.outcome }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');

            const baseSha = process.env.UI_CONTRACT_BASE_SHA;
            const headSha = process.env.UI_CONTRACT_HEAD_SHA;
            const checkoutOutcome = process.env.UI_CONTRACT_CHECKOUT_OUTCOME;
            const dependenciesOutcome = process.env.UI_CONTRACT_DEPENDENCIES_OUTCOME;
            const checkOutcome = process.env.UI_CONTRACT_CHECK_OUTCOME;
            const logPath = process.env.UI_CONTRACT_LOG;
            const resultPath = process.env.UI_CONTRACT_RESULT;
            let outcome = checkOutcome === 'success' || checkOutcome === 'failure'
              ? checkOutcome
              : 'skipped';
            const runUrl = `${context.serverUrl}/${process.env.GITHUB_REPOSITORY}/actions/runs/${context.runId}`;
            let reviewResult;
            if (resultPath && fs.existsSync(resultPath)) {
              try {
                reviewResult = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
              } catch {
                reviewResult = undefined;
              }
            }
            const reviewErrors = Array.isArray(reviewResult?.errors) ? reviewResult.errors : [];
            const reviewNotes = Array.isArray(reviewResult?.reviewNotes)
              ? reviewResult.reviewNotes
              : [];
            if (outcome === 'success' && reviewNotes.length > 0) {
              outcome = 'review';
            }
            const formatIndented = (values) =>
              [...new Set(values.filter(Boolean))]
                .flatMap((value) =>
                  String(value)
                    .split(/\r?\n/)
                    .map((line) => `    ${line}`),
                )
                .join('\n');
            const causeLines = [];
            if (reviewNotes.length > 0 && (outcome === 'failure' || outcome === 'review')) {
              causeLines.push(`리뷰 참고:\n\n${formatIndented(reviewNotes)}`);
            }
            if (outcome === 'failure') {
              if (!reviewResult) {
                causeLines.push(
                  '정확한 원인 파일을 판정하지 않았습니다. 검사 결과가 없어 checkout·dependency·import·실행 실패 가능성을 확인해야 합니다.',
                );
              } else if (reviewErrors.length > 0) {
                causeLines.push(`검사 진단:\n\n${formatIndented(reviewErrors)}`);
              } else {
                causeLines.push(
                  '정확한 원인 파일을 판정하지 않았습니다. 구조화된 검사 오류가 없어 checkout·dependency·import·실행 실패 가능성을 확인해야 합니다.',
                );
              }
            }
            let logExcerpt = '';
            let logTruncated = false;
            if (logPath && fs.existsSync(logPath)) {
              const rawLog = fs.readFileSync(logPath, 'utf8');
              const lines = rawLog.split(/\r?\n/);
              logTruncated = lines.length > 200;
              logExcerpt = lines.slice(0, 200).join('\n');
              if (logExcerpt.length > 30000) {
                logExcerpt = logExcerpt.slice(0, 30000);
                logTruncated = true;
              }
            }
            const indentedLog = logExcerpt
              .split('\n')
              .map((line) => `    ${line}`)
              .join('\n');

            const diagnosis = outcome === 'success'
              ? '정적 UI 계약 검토가 통과했습니다.'
              : outcome === 'review'
                ? '정적 UI 계약 검토는 통과했지만 혼합 변경에 대한 리뷰 참고가 있습니다.'
              : outcome === 'failure'
                ? '정적 UI 계약 검토가 실패했습니다. 원인 파일과 검사 원문을 확인하세요.'
                : '검사 단계가 실행되지 않았습니다. checkout·도구·dependency 단계의 원인을 확인하세요.';
            let causeText = causeLines.join('\n\n');
            if (causeText.length > 16000) {
              causeText = `${causeText.slice(0, 16000)}\n    원인 진단이 16000자에서 생략되었습니다.`;
            }
            const causeSection = causeLines.length
              ? [reviewErrors.length > 0 ? '### 실패 원인 파일' : '### 리뷰 참고', '', causeText, '']
              : [];
            const report = [
              '## UI Contract Review (참고용)',
              '',
              '이 workflow는 required check가 아니며 merge를 차단하지 않습니다.',
              '',
              `- Base: \`${baseSha}\``,
              `- Head: \`${headSha}\``,
              `- Run: [workflow 실행 결과](${runUrl})`,
              `- Checkout: \`${checkoutOutcome}\``,
              `- Dependencies: \`${dependenciesOutcome}\``,
              `- Review: \`${checkOutcome}\``,
              '',
              ...causeSection,
              diagnosis,
              '',
              '직접 ESLint 규칙, 원격 CI/merge ruleset, Native·Storybook runtime 검증과 별도의 참고 결과입니다.',
              '',
              logExcerpt
                ? `<details><summary>검사 원문 출력 (최대 200줄·30000자)</summary>\n\n${indentedLog}${logTruncated ? '\n\n    출력이 최대 200줄 또는 30000자에서 생략되었습니다.' : ''}\n\n</details>`
                : '검사 원문 출력 파일이 없어 설치 또는 실행 단계의 실패를 별도로 확인해야 합니다.',
            ].join('\n');

            await core.summary.addRaw(report).write();
            core.setOutput('outcome', outcome);
            core.setOutput('report', report);

  comment-ui-contract-review:
    name: Report UI Contract Review on the PR
    needs: ui-contract-review
    concurrency:
      group: ui-contract-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]' &&
      (needs.ui-contract-review.outputs.outcome == 'success' ||
      needs.ui-contract-review.outputs.outcome == 'failure' ||
      needs.ui-contract-review.outputs.outcome == 'review')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create or resolve UI contract review comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          UI_CONTRACT_OUTCOME: ${{ needs.ui-contract-review.outputs.outcome }}
          UI_CONTRACT_REPORT: ${{ needs.ui-contract-review.outputs.report }}
        with:
          github-token: ${{ github.token }}
          script: |
            const COMMENT_MARKER = '<!-- ui-contract-review -->';
            const RUN_MARKER_PATTERN = /<!-- ui-contract-review-run:(\d+)-attempt:(\d+) -->/;
            const report = process.env.UI_CONTRACT_REPORT;
            const outcome = process.env.UI_CONTRACT_OUTCOME;
            if (!report || !['success', 'failure', 'review'].includes(outcome)) {
              throw new Error('UI contract review report or outcome was not provided.');
            }

            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            const eventPullRequest = context.payload.pull_request;
            const currentPullRequest = await github.rest.pulls.get({ owner, repo, pull_number: issueNumber });
            const current = currentPullRequest.data;
            if (
              current.state !== 'open' ||
              current.head?.sha !== eventPullRequest.head?.sha ||
              current.base?.sha !== eventPullRequest.base?.sha ||
              (current.body ?? '') !== (eventPullRequest.body ?? '')
            ) {
              core.info('PR가 event와 달라져 stale 결과를 건너뜁니다.');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const trackedComments = comments
              .filter((comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                typeof comment.body === 'string' &&
                comment.body.startsWith(COMMENT_MARKER),
              )
              .sort((left, right) => right.id - left.id);
            const runId = BigInt(process.env.GITHUB_RUN_ID ?? context.runId);
            const runAttempt = BigInt(process.env.GITHUB_RUN_ATTEMPT ?? '1');
            const runMarker = `<!-- ui-contract-review-run:${runId}-attempt:${runAttempt} -->`;
            const newerComment = trackedComments.find((comment) => {
              const match = comment.body.match(RUN_MARKER_PATTERN);
              if (!match) return false;
              const commentRunId = BigInt(match[1]);
              const commentAttempt = BigInt(match[2]);
              return commentRunId > runId ||
                (commentRunId === runId && commentAttempt > runAttempt);
            });
            if (newerComment) {
              core.info(`더 최신 run(${newerComment.id})이 있어 오래된 결과를 건너뜁니다.`);
              return;
            }

            const existingComment = trackedComments[0];
            const status = outcome === 'failure'
              ? '⚠️ UI Contract Review 실패'
              : outcome === 'review'
                ? 'ℹ️ UI Contract Review 참고'
                : '✅ UI Contract Review 해결됨';
            const body = [COMMENT_MARKER, runMarker, status, '', report].join('\n');

            if (outcome === 'failure' || outcome === 'review') {
              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  body,
                  comment_id: existingComment.id,
                });
              } else {
                await github.rest.issues.createComment({
                  body,
                  issue_number: issueNumber,
                  owner,
                  repo,
                });
              }
              return;
            }

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                body,
                comment_id: existingComment.id,
              });
            }
