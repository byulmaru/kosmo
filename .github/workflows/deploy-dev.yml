name: Deploy Dev

on:
  workflow_run:
    workflows: [Docker Build]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: false

jobs:
  restart_dev:
    name: Restart Dev Workloads
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    env:
      ARGOCD_CLI_VERSION: 3.4.2
      ARGOCD_SERVER: argocd-aws.tail1fdd55.ts.net
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          name: kosmo-dev

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and validate dev image digest
        id: image
        env:
          IMAGE_REFERENCE: ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Docker Build did not provide a valid full commit SHA."
            exit 1
          fi

          image_digest="$(
            docker buildx imagetools inspect "${IMAGE_REFERENCE}" --format '{{json .Manifest}}' \
              | jq -er '.digest | strings | select(test("^sha256:[0-9a-f]{64}$"))'
          )"
          echo "image_digest=${image_digest}" >> "${GITHUB_OUTPUT}"

      - name: Install Argo CD CLI
        uses: clowdhaus/argo-cd-action@946f488cf2607049c2e6ca86902ac50783927ec1 # v4.2.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: ${{ env.ARGOCD_CLI_VERSION }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: tag:github-actions

      - name: Get Argo CD token
        id: argocd-token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const githubToken = await core.getIDToken();
            core.setSecret(githubToken);

            const response = await fetch(`https://${process.env.ARGOCD_SERVER}/api/dex/token`, {
              method: "POST",
              headers: {
                authorization: `Basic ${Buffer.from("argo-cd-cli:").toString("base64")}`,
              },
              body: new URLSearchParams({
                connector_id: "github-actions",
                grant_type: "urn:ietf:params:oauth:grant-type:token-exchange",
                scope: "openid email profile federated:id",
                requested_token_type: "urn:ietf:params:oauth:token-type:access_token",
                subject_token: githubToken,
                subject_token_type: "urn:ietf:params:oauth:token-type:id_token",
              }),
            });

            if (!response.ok) {
              throw new Error(`Dex token exchange failed: ${response.status} ${await response.text()}`);
            }

            const { access_token: dexToken } = await response.json();
            if (!dexToken) {
              throw new Error("Dex token response did not include an access token.");
            }

            core.setSecret(dexToken);
            core.setOutput("token", dexToken);

      - name: Sync dev application
        env:
          ARGOCD_AUTH_TOKEN: ${{ steps.argocd-token.outputs.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail

          argocd --server "${ARGOCD_SERVER}" --grpc-web app set kosmo-dev \
            --revision "${TARGET_SHA}" \
            -p "version=${TARGET_SHA}" \
            -p "imageDigest=${IMAGE_DIGEST}" \
            --validate

          argocd --server "${ARGOCD_SERVER}" --grpc-web app sync kosmo-dev --timeout 600

      - name: Restart dev workloads
        env:
          ARGOCD_AUTH_TOKEN: ${{ steps.argocd-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          for rollout in kosmo-web kosmo-api; do
            argocd --server "${ARGOCD_SERVER}" --grpc-web app actions run kosmo-dev restart \
              --group argoproj.io \
              --kind Rollout \
              --namespace kosmo-dev \
              --resource-name "${rollout}"
          done

          argocd --server "${ARGOCD_SERVER}" --grpc-web app actions run kosmo-dev restart \
            --group apps \
            --kind Deployment \
            --namespace kosmo-dev \
            --all
