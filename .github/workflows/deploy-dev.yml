name: Deploy Dev

on:
  workflow_run:
    workflows: [Docker Build]
    branches: [main]
    types: [completed]

permissions:
  actions: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: false

jobs:
  restart_dev:
    name: Restart Dev Workloads
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    env:
      ARGOCD_CLI_VERSION: 3.4.2
      ARGOCD_SERVER: argocd-aws.tail1fdd55.ts.net
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Install Argo CD CLI
        uses: clowdhaus/argo-cd-action@946f488cf2607049c2e6ca86902ac50783927ec1 # v4.2.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: ${{ env.ARGOCD_CLI_VERSION }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: tag:github-actions

      - name: Download canonical release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: canonical-release-manifest
          path: canonical-release-manifest
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate canonical release manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail

          manifest_path="canonical-release-manifest/release-manifest.json"
          image_digest="$(jq -er '.runtimes.runtime | select(test("^sha256:[0-9a-f]{64}$"))' "${manifest_path}")"
          image_reference="ghcr.io/${GITHUB_REPOSITORY}@${image_digest}"

          {
            echo "image_digest=${image_digest}"
            echo "image_reference=${image_reference}"
          } >> "${GITHUB_OUTPUT}"

      - name: Get Argo CD token
        id: argocd-token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const githubToken = await core.getIDToken();
            core.setSecret(githubToken);

            const response = await fetch(`https://${process.env.ARGOCD_SERVER}/api/dex/token`, {
              method: "POST",
              headers: {
                authorization: `Basic ${Buffer.from("argo-cd-cli:").toString("base64")}`,
              },
              body: new URLSearchParams({
                connector_id: "github-actions",
                grant_type: "urn:ietf:params:oauth:grant-type:token-exchange",
                scope: "openid email profile federated:id",
                requested_token_type: "urn:ietf:params:oauth:token-type:access_token",
                subject_token: githubToken,
                subject_token_type: "urn:ietf:params:oauth:token-type:id_token",
              }),
            });

            if (!response.ok) {
              throw new Error(`Dex token exchange failed: ${response.status} ${await response.text()}`);
            }

            const { access_token: dexToken } = await response.json();
            if (!dexToken) {
              throw new Error("Dex token response did not include an access token.");
            }

            core.setSecret(dexToken);
            core.setOutput("token", dexToken);

      - name: Sync dev application
        env:
          ARGOCD_AUTH_TOKEN: ${{ steps.argocd-token.outputs.token }}
          IMAGE_DIGEST: ${{ steps.manifest.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail

          argocd --server "${ARGOCD_SERVER}" --grpc-web app set kosmo-dev \
            --revision "${TARGET_SHA}" \
            -p "version=${TARGET_SHA}" \
            -p "imageDigest=${IMAGE_DIGEST}" \
            -p "runtimeConfig.openPanelClientId=" \
            -p "migration.enabled=true" \
            --validate

          argocd --server "${ARGOCD_SERVER}" --grpc-web app sync kosmo-dev \
            --revision "${TARGET_SHA}" \
            --timeout 600
          argocd --server "${ARGOCD_SERVER}" --grpc-web app wait kosmo-dev \
            --sync \
            --health \
            --timeout 600

      - name: Restart dev workloads
        env:
          ARGOCD_AUTH_TOKEN: ${{ steps.argocd-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          for rollout in kosmo-web kosmo-api; do
            argocd --server "${ARGOCD_SERVER}" --grpc-web app actions run kosmo-dev restart \
              --group argoproj.io \
              --kind Rollout \
              --namespace kosmo-dev \
              --resource-name "${rollout}"
          done

          argocd --server "${ARGOCD_SERVER}" --grpc-web app actions run kosmo-dev restart \
            --group apps \
            --kind Deployment \
            --namespace kosmo-dev \
            --all

      - name: Record dev release
        if: always()
        env:
          IMAGE_DIGEST: ${{ steps.manifest.outputs.image_digest }}
          IMAGE_REFERENCE: ${{ steps.manifest.outputs.image_reference }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "### Dev canonical release"
            echo
            echo "- Target SHA: ${TARGET_SHA}"
            echo "- Canonical build run: ${BUILD_RUN_ID}"
            echo "- Runtime image set: ${IMAGE_REFERENCE}"
            echo "- Argo source revision: ${TARGET_SHA}"
            echo "- Migration/workload digest: ${IMAGE_DIGEST}"
            echo "- Result: ${RESULT}"
          } >> "${GITHUB_STEP_SUMMARY}"
