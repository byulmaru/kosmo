name: Production Release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Optional full 40-character commit SHA with a canonical Docker Build artifact (defaults to the latest main commit)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  production_deploy:
    name: >-
      Approve and Deploy Production
      (manual ${{ needs.canonical_preflight.outputs.target_sha }})
    needs: canonical_preflight
    if: needs.canonical_preflight.result == 'success'
    runs-on: ubuntu-24.04-arm
    environment:
      name: prod
      url: ${{ needs.canonical_preflight.outputs.target_url }}
    concurrency:
      group: production-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARGOCD_CLI_VERSION: 3.4.2
      ARGOCD_SERVER: argocd-aws.tail1fdd55.ts.net
      TARGET_SHA: ${{ needs.canonical_preflight.outputs.target_sha }}
      CANONICAL_BUILD_RUN_ID: ${{ needs.canonical_preflight.outputs.build_run_id }}
      CANONICAL_BUILD_RUN_URL: ${{ needs.canonical_preflight.outputs.build_run_url }}
      IMAGE_DIGEST: ${{ needs.canonical_preflight.outputs.image_digest }}

    steps:
      - name: Install Argo CD CLI
        uses: clowdhaus/argo-cd-action@946f488cf2607049c2e6ca86902ac50783927ec1 # v4.2.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: ${{ env.ARGOCD_CLI_VERSION }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: tag:github-actions

      - name: Get Argo CD token
        id: argocd-token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const githubToken = await core.getIDToken();
            core.setSecret(githubToken);

            const response = await fetch(`https://${process.env.ARGOCD_SERVER}/api/dex/token`, {
              method: "POST",
              headers: {
                authorization: `Basic ${Buffer.from("argo-cd-cli:").toString("base64")}`,
              },
              body: new URLSearchParams({
                connector_id: "github-actions",
                grant_type: "urn:ietf:params:oauth:grant-type:token-exchange",
                scope: "openid email profile federated:id",
                requested_token_type: "urn:ietf:params:oauth:token-type:access_token",
                subject_token: githubToken,
                subject_token_type: "urn:ietf:params:oauth:token-type:id_token",
              }),
            });

            if (!response.ok) {
              throw new Error(`Dex token exchange failed: ${response.status} ${await response.text()}`);
            }

            const { access_token: dexToken } = await response.json();
            if (!dexToken) {
              throw new Error("Dex token response did not include an access token.");
            }

            core.setSecret(dexToken);
            core.setOutput("token", dexToken);

      - name: Sync migration and production workloads
        env:
          ARGOCD_AUTH_TOKEN: ${{ steps.argocd-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          argocd --server "${ARGOCD_SERVER}" --grpc-web app set kosmo-prod \
            --revision "${TARGET_SHA}" \
            -p "version=${TARGET_SHA}" \
            -p "imageDigest=${IMAGE_DIGEST}" \
            -p "migration.enabled=true" \
            --validate

          argocd --server "${ARGOCD_SERVER}" --grpc-web app sync kosmo-prod \
            --revision "${TARGET_SHA}" \
            --prune \
            --timeout 600
          argocd --server "${ARGOCD_SERVER}" --grpc-web app wait kosmo-prod \
            --sync \
            --health \
            --timeout 600

          app_json="$(argocd --server "${ARGOCD_SERVER}" --grpc-web app get kosmo-prod --output json)"
          actual_source_revision="$(jq -r '.status.sync.revision' <<<"${app_json}")"
          actual_image_digest="$(jq -r '.spec.source.helm.parameters[] | select(.name == "imageDigest") | .value' <<<"${app_json}")"
          if [[ "${actual_source_revision}" != "${TARGET_SHA}" ]]; then
            echo "::error::Argo CD synced revision ${actual_source_revision}, expected ${TARGET_SHA}."
            exit 1
          fi
          if [[ "${actual_image_digest}" != "${IMAGE_DIGEST}" ]]; then
            echo "::error::Argo CD image digest ${actual_image_digest}, expected ${IMAGE_DIGEST}."
            exit 1
          fi

      - name: Record production release
        if: always()
        env:
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "### Manual production release"
            echo
            echo "- Trigger: manual"
            echo "- Requester: ${GITHUB_ACTOR}"
            echo "- Workflow definition ref: ${GITHUB_REF}"
            echo "- Target SHA: ${TARGET_SHA}"
            echo "- Canonical Docker Build run: [${CANONICAL_BUILD_RUN_ID}](${CANONICAL_BUILD_RUN_URL})"
            echo "- Runtime image: ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}"
            echo "- Migration/workload digest: ${IMAGE_DIGEST}"
            echo "- Argo source revision: ${TARGET_SHA}"
            echo "- Approval boundary: prod Environment"
            echo "- Production image build: not executed (canonical artifact promotion)"
            echo "- Result: ${RESULT}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
          } >> "${GITHUB_STEP_SUMMARY}"

  canonical_preflight:
    name: Validate Canonical Release Artifact
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      target_url: ${{ steps.resolve.outputs.target_url }}
      build_run_id: ${{ steps.resolve.outputs.build_run_id }}
      build_run_url: ${{ steps.resolve.outputs.build_run_url }}
      image_digest: ${{ steps.manifest.outputs.image_digest }}

    steps:
      - name: Resolve trusted canonical Docker Build
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA_INPUT: ${{ inputs.target_sha }}
        with:
          script: |
            const requestedSha = process.env.TARGET_SHA_INPUT.trim().toLowerCase();

            if (context.ref !== "refs/heads/main") {
              throw new Error(`Production release must run from main, got ${context.ref}.`);
            }

            let targetSha = requestedSha;
            if (!targetSha) {
              const { data: branch } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: "main",
              });
              targetSha = branch.commit.sha.toLowerCase();
            }
            if (!/^[0-9a-f]{40}$/.test(targetSha)) {
              throw new Error("target_sha must be an exact 40-character hexadecimal commit SHA.");
            }

            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: targetSha,
            });
            if (commit.sha.toLowerCase() !== targetSha) {
              throw new Error(`GitHub resolved target ${commit.sha}, expected ${targetSha}.`);
            }

            const { data: workflowRuns } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "docker-build.yml",
              event: "push",
              status: "completed",
              head_sha: targetSha,
              per_page: 100,
            });
            const canonicalRuns = workflowRuns.workflow_runs.filter(
              (run) =>
                run.event === "push" &&
                run.head_branch === "main" &&
                run.conclusion === "success",
            );
            if (canonicalRuns.length !== 1) {
              throw new Error(
                `Expected exactly one successful main Docker Build run for ${targetSha}, found ${canonicalRuns.length}.`,
              );
            }

            const buildRun = canonicalRuns[0];
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: buildRun.id,
              per_page: 100,
            });
            const manifestArtifacts = artifacts.artifacts.filter(
              (artifact) => artifact.name === "canonical-release-manifest",
            );
            if (manifestArtifacts.length !== 1 || manifestArtifacts[0].expired) {
              throw new Error(
                `Canonical release manifest is missing, expired, or ambiguous for Docker Build run ${buildRun.id}.`,
              );
            }

            core.setOutput("target_sha", targetSha);
            core.setOutput("target_url", commit.html_url);
            core.setOutput("build_run_id", String(buildRun.id));
            core.setOutput("build_run_url", buildRun.html_url);

      - name: Download canonical release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: canonical-release-manifest
          path: canonical-release-manifest
          github-token: ${{ github.token }}
          run-id: ${{ steps.resolve.outputs.build_run_id }}

      - name: Validate canonical release manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail

          manifest_path="canonical-release-manifest/release-manifest.json"
          image_digest="$(jq -er '
            if type != "object" then
              error("manifest must be an object")
            elif (keys | sort) != ["imageDigest"] then
              error("manifest must contain only imageDigest")
            elif (.imageDigest | type) != "string" then
              error("imageDigest must be a string")
            elif (.imageDigest | test("^sha256:[0-9a-f]{64}$") | not) then
              error("imageDigest must be a valid sha256 digest")
            else
              .imageDigest
            end
          ' "${manifest_path}")"
          echo "image_digest=${image_digest}" >> "${GITHUB_OUTPUT}"

      - name: Record preflight identity
        if: always()
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha || inputs.target_sha || 'unresolved' }}
          BUILD_RUN_ID: ${{ steps.resolve.outputs.build_run_id || 'unresolved' }}
          BUILD_RUN_URL: ${{ steps.resolve.outputs.build_run_url || 'unresolved' }}
          IMAGE_DIGEST: ${{ steps.manifest.outputs.image_digest || 'unresolved' }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "### Canonical production preflight"
            echo
            echo "- Trigger: ${GITHUB_EVENT_NAME}"
            echo "- Requester: ${GITHUB_ACTOR}"
            echo "- Workflow definition ref: ${GITHUB_REF}"
            echo "- Target SHA: ${TARGET_SHA}"
            echo "- Canonical Docker Build run: [${BUILD_RUN_ID}](${BUILD_RUN_URL})"
            echo "- Runtime image: ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}"
            echo "- Result: ${RESULT}"
          } >> "${GITHUB_STEP_SUMMARY}"
