name: Production Release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Optional full 40-character commit SHA to build and deploy after approval (defaults to the latest main commit)
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  ENVIRONMENT: prod

jobs:
  production_deploy:
    name: >-
      Approve, Build and Deploy Production
      (manual ${{ needs.manual_preflight.outputs.target_sha }})
    needs: manual_preflight
    if: needs.manual_preflight.result == 'success'
    runs-on: ubuntu-24.04-arm
    environment:
      name: prod
      url: ${{ needs.manual_preflight.outputs.target_url }}
    concurrency:
      group: production-release
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
    env:
      ARGOCD_CLI_VERSION: 3.4.2
      ARGOCD_SERVER: argocd-aws.tail1fdd55.ts.net
      TARGET_SHA: ${{ needs.manual_preflight.outputs.target_sha }}

    steps:
      - name: Checkout target commit after approval
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Install Argo CD CLI
        uses: clowdhaus/argo-cd-action@946f488cf2607049c2e6ca86902ac50783927ec1 # v4.2.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: ${{ env.ARGOCD_CLI_VERSION }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: tag:github-actions

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          name: kosmo-production

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load production Sentry DSN from Vault
        id: sentry
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ vars.VAULT_ADDR }}
          path: github-actions
          method: jwt
          role: kosmo-build-prod
          jwtGithubAudience: ${{ vars.VAULT_GITHUB_ACTIONS_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/kubernetes/kosmo/prod EXPO_PUBLIC_SENTRY_DSN | EXPO_PUBLIC_SENTRY_DSN

      - name: Extract production release metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=prod-sha-${{ env.TARGET_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build and push production image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=production-release
          cache-to: type=gha,mode=max,scope=production-release,ignore-error=true
          no-cache-filters: |
            app-build
            runtime
          build-args: |
            EXPO_PUBLIC_ENVIRONMENT=${{ env.ENVIRONMENT }}
            EXPO_PUBLIC_POSTHOG_KEY=${{ vars.EXPO_PUBLIC_POSTHOG_KEY }}
            EXPO_PUBLIC_POSTHOG_HOST=${{ vars.EXPO_PUBLIC_POSTHOG_HOST }}
            EXPO_PUBLIC_SENTRY_DSN=${{ steps.sentry.outputs.EXPO_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_RELEASE=kosmo@${{ env.TARGET_SHA }}
            SENTRY_UPLOAD_REQUIRED=1
          # Public client settings are intentionally inlined into the Web bundle; build args make changes part of the cache key.
          secret-envs: |
            sentry_auth_token=SENTRY_AUTH_TOKEN

      - name: Validate production image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Production build did not produce a valid image digest."
            exit 1
          fi

      - name: Get Argo CD token
        id: argocd-token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const githubToken = await core.getIDToken();
            core.setSecret(githubToken);

            const response = await fetch(`https://${process.env.ARGOCD_SERVER}/api/dex/token`, {
              method: "POST",
              headers: {
                authorization: `Basic ${Buffer.from("argo-cd-cli:").toString("base64")}`,
              },
              body: new URLSearchParams({
                connector_id: "github-actions",
                grant_type: "urn:ietf:params:oauth:grant-type:token-exchange",
                scope: "openid email profile federated:id",
                requested_token_type: "urn:ietf:params:oauth:token-type:access_token",
                subject_token: githubToken,
                subject_token_type: "urn:ietf:params:oauth:token-type:id_token",
              }),
            });

            if (!response.ok) {
              throw new Error(`Dex token exchange failed: ${response.status} ${await response.text()}`);
            }

            const { access_token: dexToken } = await response.json();
            if (!dexToken) {
              throw new Error("Dex token response did not include an access token.");
            }

            core.setSecret(dexToken);
            core.setOutput("token", dexToken);

      - name: Sync migration and production workloads
        env:
          ARGOCD_AUTH_TOKEN: ${{ steps.argocd-token.outputs.token }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          argocd --server "${ARGOCD_SERVER}" --grpc-web app set kosmo-prod \
            --revision "${TARGET_SHA}" \
            -p "version=${TARGET_SHA}" \
            -p "imageDigest=${IMAGE_DIGEST}" \
            -p "migration.enabled=true" \
            --validate

          argocd --server "${ARGOCD_SERVER}" --grpc-web app sync kosmo-prod \
            --revision "${TARGET_SHA}" \
            --prune \
            --timeout 600
          argocd --server "${ARGOCD_SERVER}" --grpc-web app wait kosmo-prod \
            --sync \
            --health \
            --timeout 600

          app_json="$(argocd --server "${ARGOCD_SERVER}" --grpc-web app get kosmo-prod --output json)"
          actual_source_revision="$(jq -r '.status.sync.revision' <<<"${app_json}")"
          actual_image_digest="$(jq -r '.spec.source.helm.parameters[] | select(.name == "imageDigest") | .value' <<<"${app_json}")"
          if [[ "${actual_source_revision}" != "${TARGET_SHA}" ]]; then
            echo "::error::Argo CD synced revision ${actual_source_revision}, expected ${TARGET_SHA}."
            exit 1
          fi
          if [[ "${actual_image_digest}" != "${IMAGE_DIGEST}" ]]; then
            echo "::error::Argo CD image digest ${actual_image_digest}, expected ${IMAGE_DIGEST}."
            exit 1
          fi

      - name: Record production release
        if: always()
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "### Manual production release"
            echo
            echo "- Trigger: manual"
            echo "- Requester: ${GITHUB_ACTOR}"
            echo "- Workflow definition ref: ${GITHUB_REF}"
            echo "- Target SHA: ${TARGET_SHA}"
            echo "- Image identity: ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}"
            echo "- Argo source revision: ${TARGET_SHA}"
            echo "- Approval boundary: prod Environment"
            echo "- Result: ${RESULT}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
          } >> "${GITHUB_STEP_SUMMARY}"

  manual_preflight:
    name: Validate Manual Production Target
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      target_url: ${{ steps.resolve.outputs.target_url }}

    steps:
      - name: Validate main workflow ref and resolve target commit
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA_INPUT: ${{ inputs.target_sha }}
        with:
          script: |
            const requestedSha = process.env.TARGET_SHA_INPUT.trim().toLowerCase();

            if (context.ref !== "refs/heads/main") {
              throw new Error(`Manual production release must run from main, got ${context.ref}.`);
            }

            let targetSha = requestedSha;
            if (targetSha) {
              if (!/^[0-9a-f]{40}$/.test(requestedSha)) {
                throw new Error("target_sha must be an exact 40-character hexadecimal commit SHA.");
              }
            } else {
              let branch;
              try {
                ({ data: branch } = await github.rest.repos.getBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch: "main",
                }));
              } catch (error) {
                throw new Error("Could not resolve the latest main commit in this repository.");
              }

              targetSha = branch.commit.sha.toLowerCase();
              if (!/^[0-9a-f]{40}$/.test(targetSha)) {
                throw new Error(`GitHub returned an invalid latest main commit SHA: ${targetSha}.`);
              }
            }

            let commit;
            try {
              ({ data: commit } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: targetSha,
              }));
            } catch (error) {
              throw new Error(`Target commit ${targetSha} does not exist in this repository.`);
            }

            if (commit.sha.toLowerCase() !== targetSha) {
              throw new Error(`GitHub resolved target ${commit.sha}, expected ${targetSha}.`);
            }

            core.setOutput("target_sha", targetSha);
            core.setOutput("target_url", commit.html_url);

      - name: Record manual preflight
        if: success()
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
          TARGET_URL: ${{ steps.resolve.outputs.target_url }}
        shell: bash
        run: |
          {
            echo "### Manual production release preflight"
            echo
            echo "- Trigger: workflow_dispatch"
            echo "- Workflow definition ref: ${GITHUB_REF}"
            echo "- Target commit: [${TARGET_SHA}](${TARGET_URL})"
            echo "- Target code checkout/build: deferred until prod Environment approval"
            echo "- Production credentials: not requested during preflight"
          } >> "${GITHUB_STEP_SUMMARY}"
