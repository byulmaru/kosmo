name: iOS TestFlight Internal Distribution

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ios-ad-hoc-distribution
  cancel-in-progress: false

jobs:
  distribute:
    name: Build and distribute iOS App Store IPA
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    environment: prod
    env:
      EXPO_NO_GIT_STATUS: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Connect to Tailscale for Vault
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: tag:github-actions

      - name: Set up mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          cache: false

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        with:
          bundler-cache: true
          ruby: '3.4'
          working-directory: apps/app

      - name: Verify native build tools
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          pod --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Set unique iOS build number
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::GITHUB_RUN_ID must be a positive integer."
            exit 1
          fi
          if [[ ! "${GITHUB_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::GITHUB_RUN_ATTEMPT must be a positive integer."
            exit 1
          fi

          # Keep a fixed three-digit attempt suffix; fail rather than collide after 999 reruns.
          attempt_number=$((10#${GITHUB_RUN_ATTEMPT}))
          if ((attempt_number > 999)); then
            echo "::error::GITHUB_RUN_ATTEMPT exceeds the three-digit iOS build number suffix limit."
            exit 1
          fi
          ios_build_number="${GITHUB_RUN_ID}$(printf '%03d' "${attempt_number}")"
          if [[ ! "${ios_build_number}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The generated iOS build number must be a positive integer."
            exit 1
          fi
          echo "IOS_BUILD_NUMBER=${ios_build_number}" >> "${GITHUB_ENV}"

      - name: Load iOS signing credentials from Vault
        id: ios_signing
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ vars.VAULT_ADDR }}
          path: github-actions
          method: jwt
          role: kosmo-ios-testflight
          jwtGithubAudience: ${{ vars.VAULT_GITHUB_ACTIONS_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/kosmo/prod/ios-signing IOS_DISTRIBUTION_CERTIFICATE_BASE64 | IOS_DISTRIBUTION_CERTIFICATE_BASE64 ;
            secret/data/kosmo/prod/ios-signing IOS_DISTRIBUTION_CERTIFICATE_PASSWORD | IOS_DISTRIBUTION_CERTIFICATE_PASSWORD ;
            secret/data/kosmo/prod/ios-signing IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 | IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 ;
            secret/data/kosmo/prod/ios-signing APPLE_API_KEY_ID | APPLE_API_KEY_ID ;
            secret/data/kosmo/prod/ios-signing APPLE_API_ISSUER_ID | APPLE_API_ISSUER_ID ;
            secret/data/kosmo/prod/ios-signing APPLE_API_KEY_P8_BASE64 | APPLE_API_KEY_P8_BASE64

      - name: Restore iOS signing files
        shell: bash
        env:
          IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ steps.ios_signing.outputs.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ steps.ios_signing.outputs.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
        run: |
          set -euo pipefail

          signing_dir="${RUNNER_TEMP}/kosmo-ios-testflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          certificate_path="${signing_dir}/distribution.p12"
          profile_path="${signing_dir}/app-store.mobileprovision"
          profile_plist_path="${signing_dir}/app-store.mobileprovision.plist"
          archive_path="${signing_dir}/Kosmo.xcarchive"
          artifact_dir="${signing_dir}/artifact"
          ipa_path="${artifact_dir}/Kosmo.ipa"
          export_options_path="${signing_dir}/export-options.plist"
          release_notes_path="${signing_dir}/release-notes.txt"

          mkdir -p "${signing_dir}" "${artifact_dir}"
          {
            echo "IOS_SIGNING_DIR=${signing_dir}"
            echo "IOS_DISTRIBUTION_CERTIFICATE_PATH=${certificate_path}"
            echo "IOS_APP_STORE_PROVISIONING_PROFILE_PATH=${profile_path}"
            echo "IOS_ARCHIVE_PATH=${archive_path}"
            echo "IOS_ARTIFACT_DIR=${artifact_dir}"
            echo "IOS_IPA_PATH=${ipa_path}"
            echo "IOS_EXPORT_OPTIONS_PATH=${export_options_path}"
            echo "IOS_RELEASE_NOTES_PATH=${release_notes_path}"
          } >> "${GITHUB_ENV}"
          chmod 700 "${signing_dir}" "${artifact_dir}"

          for name in IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_APP_STORE_PROVISIONING_PROFILE_BASE64; do
            value="${!name:-}"
            if [[ -z "${value}" || "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
              echo "::error::${name} must be a non-empty single-line base64 value."
              exit 1
            fi
          done

          if ! printf '%s' "${IOS_DISTRIBUTION_CERTIFICATE_BASE64}" | base64 -D > "${certificate_path}"; then
            echo "::error::IOS_DISTRIBUTION_CERTIFICATE_BASE64 is invalid."
            exit 1
          fi
          if ! printf '%s' "${IOS_APP_STORE_PROVISIONING_PROFILE_BASE64}" | base64 -D > "${profile_path}"; then
            echo "::error::IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 is invalid."
            exit 1
          fi
          chmod 600 "${certificate_path}" "${profile_path}"
          [[ -s "${certificate_path}" ]] || { echo "::error::The Apple distribution certificate is empty."; exit 1; }
          [[ -s "${profile_path}" ]] || { echo "::error::The App Store provisioning profile is empty."; exit 1; }

          if ! security cms -D -i "${profile_path}" > "${profile_plist_path}"; then
            echo "::error::The App Store provisioning profile could not be decoded."
            exit 1
          fi

          team_id="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "${profile_plist_path}")"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "${profile_plist_path}")"
          application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "${profile_plist_path}")"

          if [[ ! "${team_id}" =~ ^[A-Za-z0-9]{10}$ || ! "${profile_uuid}" =~ ^[A-Fa-f0-9-]{36}$ ]]; then
            echo "::error::The App Store provisioning profile has invalid identity fields."
            exit 1
          fi
          if [[ "${application_identifier}" != "${team_id}.moe.kos" ]]; then
            echo "::error::The App Store provisioning profile does not target moe.kos."
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "${profile_plist_path}" >/dev/null 2>&1; then
            echo "::error::An Ad Hoc provisioning profile was supplied; an App Store profile is required."
            exit 1
          fi
          provisions_all_devices="$(/usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "${profile_plist_path}" 2>/dev/null || true)"
          if [[ "${provisions_all_devices}" == 'true' ]]; then
            echo "::error::A universal provisioning profile is not valid for App Store distribution."
            exit 1
          fi
          get_task_allow="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "${profile_plist_path}" 2>/dev/null || true)"
          if [[ "${get_task_allow}" == 'true' ]]; then
            echo "::error::A development provisioning profile is not valid for App Store distribution."
            exit 1
          fi

          {
            echo "APPLE_DEVELOPER_TEAM_ID=${team_id}"
            echo "IOS_APP_STORE_PROVISIONING_PROFILE_UUID=${profile_uuid}"
          } >> "${GITHUB_ENV}"

      - name: Generate clean Expo iOS project
        working-directory: apps/app
        run: |
          pnpm relay
          pnpm exec expo prebuild --clean --platform ios

      - name: Install iOS signing assets
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ steps.ios_signing.outputs.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::${keychain_password}"
          keychain_path="${IOS_SIGNING_DIR}/build.keychain-db"
          original_keychains_path="${IOS_SIGNING_DIR}/original-keychains.txt"
          profile_install_dir="${HOME}/Library/MobileDevice/Provisioning Profiles"
          profile_install_path="${profile_install_dir}/${IOS_APP_STORE_PROVISIONING_PROFILE_UUID}.mobileprovision"
          profile_preexisted='false'
          if [[ -e "${profile_install_path}" || -L "${profile_install_path}" ]]; then
            profile_preexisted='true'
          fi
          if [[ -z "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD}" ]]; then
            echo "::error::IOS_DISTRIBUTION_CERTIFICATE_PASSWORD is required."
            exit 1
          fi

          if [[ "${profile_preexisted}" == 'true' ]] && ! cmp -s "${IOS_APP_STORE_PROVISIONING_PROFILE_PATH}" "${profile_install_path}"; then
            echo "::error::The installed provisioning profile does not match the Vault profile; refusing to overwrite it."
            exit 1
          fi

          security list-keychains -d user | sed -E 's/^[[:space:]]*"//; s/"$//' > "${original_keychains_path}"
          original_keychains=()
          while IFS= read -r original_keychain; do
            [[ -n "${original_keychain}" ]] && original_keychains+=("${original_keychain}")
          done < "${original_keychains_path}"
          if ((${#original_keychains[@]} == 0)); then
            echo "::error::The original keychain list contained no usable entries; refusing to change it."
            exit 1
          fi
          {
            echo "IOS_KEYCHAIN_PATH=${keychain_path}"
            echo "IOS_ORIGINAL_KEYCHAINS_PATH=${original_keychains_path}"
            echo "IOS_PROFILE_INSTALL_PATH=${profile_install_path}"
          } >> "${GITHUB_ENV}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 3600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" "${original_keychains[@]}"
          : > "${IOS_SIGNING_DIR}/keychain-list-changed"
          security import "${IOS_DISTRIBUTION_CERTIFICATE_PATH}" \
            -k "${keychain_path}" \
            -P "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}" >/dev/null
          if ! security find-identity -v -p codesigning "${keychain_path}" | grep -Eq '"Apple Distribution:'; then
            echo "::error::The temporary keychain does not contain an Apple Distribution identity."
            exit 1
          fi

          if [[ "${profile_preexisted}" == 'false' ]]; then
            mkdir -p "${profile_install_dir}"
            if [[ -e "${profile_install_path}" || -L "${profile_install_path}" ]]; then
              echo "::error::A provisioning profile appeared during setup; refusing to overwrite it."
              exit 1
            fi
            # Mark before copying so a partial copy is removed by cleanup.
            : > "${IOS_SIGNING_DIR}/profile-installed"
            chmod 600 "${IOS_SIGNING_DIR}/profile-installed"
            cp "${IOS_APP_STORE_PROVISIONING_PROFILE_PATH}" "${profile_install_path}"
          fi

      - name: Build signed App Store IPA
        working-directory: apps/app
        shell: bash
        run: |
          set -euo pipefail

          cat > "${IOS_EXPORT_OPTIONS_PATH}" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>moe.kos</key>
              <string>${IOS_APP_STORE_PROVISIONING_PROFILE_UUID}</string>
            </dict>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_DEVELOPER_TEAM_ID}</string>
          </dict>
          </plist>
          EOF
          chmod 600 "${IOS_EXPORT_OPTIONS_PATH}"

          xcodebuild \
            -workspace ios/Kosmo.xcworkspace \
            -scheme Kosmo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "${IOS_ARCHIVE_PATH}" \
            -derivedDataPath "${IOS_SIGNING_DIR}/derived-data" \
            DEVELOPMENT_TEAM="${APPLE_DEVELOPER_TEAM_ID}" \
            PRODUCT_BUNDLE_IDENTIFIER=moe.kos \
            CURRENT_PROJECT_VERSION="${IOS_BUILD_NUMBER}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="${IOS_APP_STORE_PROVISIONING_PROFILE_UUID}" \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath "${IOS_ARCHIVE_PATH}" \
            -exportOptionsPlist "${IOS_EXPORT_OPTIONS_PATH}" \
            -exportPath "${IOS_ARTIFACT_DIR}"

          test -s "${IOS_IPA_PATH}"

      - name: Verify App Store IPA
        id: verify
        working-directory: apps/app
        shell: bash
        run: |
          set -euo pipefail

          test -s "${IOS_IPA_PATH}"
          verify_dir="$(mktemp -d "${RUNNER_TEMP}/kosmo-ios-verify.XXXXXX")"
          trap 'rm -rf "${verify_dir}"' EXIT
          unzip -qq "${IOS_IPA_PATH}" -d "${verify_dir}"

          app_bundles=("${verify_dir}"/Payload/*.app)
          if [[ ! -d "${app_bundles[0]}" || "${#app_bundles[@]}" != 1 ]]; then
            echo "::error::IPA must contain exactly one app bundle."
            exit 1
          fi
          app_bundle="${app_bundles[0]}"
          info_plist="${app_bundle}/Info.plist"
          profile_path="${app_bundle}/embedded.mobileprovision"
          profile_plist_path="${verify_dir}/embedded.mobileprovision.plist"

          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${info_plist}")"
          version_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${info_plist}")"
          build_number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${info_plist}")"
          [[ "${bundle_id}" == 'moe.kos' ]] || { echo "::error::IPA bundle identifier is ${bundle_id}."; exit 1; }
          [[ "${build_number}" == "${IOS_BUILD_NUMBER}" ]] || { echo "::error::IPA build number is ${build_number}."; exit 1; }
          [[ -n "${version_name}" ]] || { echo "::error::IPA version is empty."; exit 1; }
          [[ -f "${profile_path}" ]] || { echo "::error::IPA does not embed a provisioning profile."; exit 1; }

          security cms -D -i "${profile_path}" > "${profile_plist_path}"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "${profile_plist_path}")"
          profile_team_id="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "${profile_plist_path}")"
          application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "${profile_plist_path}")"
          [[ "${profile_uuid}" == "${IOS_APP_STORE_PROVISIONING_PROFILE_UUID}" ]] || { echo "::error::IPA provisioning profile UUID mismatch."; exit 1; }
          [[ "${profile_team_id}" == "${APPLE_DEVELOPER_TEAM_ID}" ]] || { echo "::error::IPA provisioning profile team mismatch."; exit 1; }
          [[ "${application_identifier}" == "${APPLE_DEVELOPER_TEAM_ID}.moe.kos" ]] || { echo "::error::IPA provisioning profile app identifier mismatch."; exit 1; }
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "${profile_plist_path}" >/dev/null 2>&1; then
            echo "::error::IPA contains an Ad Hoc provisioning profile."
            exit 1
          fi
          provisions_all_devices="$(/usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "${profile_plist_path}" 2>/dev/null || true)"
          [[ "${provisions_all_devices}" != 'true' ]] || { echo "::error::IPA contains a universal provisioning profile."; exit 1; }
          get_task_allow="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "${profile_plist_path}" 2>/dev/null || true)"
          [[ "${get_task_allow}" != 'true' ]] || { echo "::error::IPA contains a development provisioning profile."; exit 1; }

          signing_output="$(codesign --display --verbose=4 "${app_bundle}" 2>&1)"
          codesign --verify --deep --strict --verbose=2 "${app_bundle}"
          grep -Eq '^Authority=(Apple|iPhone) Distribution' <<< "${signing_output}" || {
            echo "::error::IPA is not signed with an Apple Distribution certificate."
            exit 1
          }
          grep -Eq "TeamIdentifier=${APPLE_DEVELOPER_TEAM_ID}([[:space:]]|$)" <<< "${signing_output}" || {
            echo "::error::IPA signing team does not match the provisioning profile."
            exit 1
          }

          artifact_sha256="$(shasum -a 256 "${IOS_IPA_PATH}" | awk '{print $1}')"
          artifact_size_bytes="$(wc -c < "${IOS_IPA_PATH}" | tr -d '[:space:]')"
          {
            echo "bundle_identifier=${bundle_id}"
            echo "version_name=${version_name}"
            echo "build_number=${build_number}"
            echo "team_id=${profile_team_id}"
            echo "profile_uuid=${profile_uuid}"
            echo "artifact_sha256=${artifact_sha256}"
            echo "artifact_size_bytes=${artifact_size_bytes}"
          } >> "${GITHUB_OUTPUT}"

      - name: Write TestFlight release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Commit: ${GITHUB_SHA}"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Build: ${IOS_BUILD_NUMBER}"
          } > "${IOS_RELEASE_NOTES_PATH}"
          chmod 600 "${IOS_RELEASE_NOTES_PATH}"

      - name: Restore App Store Connect API key
        shell: bash
        env:
          APPLE_API_ISSUER_ID: ${{ steps.ios_signing.outputs.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ steps.ios_signing.outputs.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ steps.ios_signing.outputs.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          for name in APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            value="${!name:-}"
            if [[ -z "${value}" || "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
              echo "::error::${name} must be a non-empty single-line value."
              exit 1
            fi
          done
          if [[ -z "${APPLE_API_KEY_P8_BASE64}" || "${APPLE_API_KEY_P8_BASE64}" == *$'\n'* || "${APPLE_API_KEY_P8_BASE64}" == *$'\r'* ]]; then
            echo "::error::APPLE_API_KEY_P8_BASE64 must be a non-empty single-line base64 value."
            exit 1
          fi
          api_key_path="${IOS_SIGNING_DIR}/app-store-connect.p8"
          if ! printf '%s' "${APPLE_API_KEY_P8_BASE64}" | base64 -D > "${api_key_path}"; then
            echo "::error::APPLE_API_KEY_P8_BASE64 is invalid."
            exit 1
          fi
          chmod 600 "${api_key_path}"
          grep -Fq -- '-----BEGIN PRIVATE KEY-----' "${api_key_path}" || {
            echo "::error::The App Store Connect API key is not a private key."
            exit 1
          }
          echo "APPLE_API_KEY_PATH=${api_key_path}" >> "${GITHUB_ENV}"

      - name: Upload IPA to TestFlight internal testing
        working-directory: apps/app
        env:
          APPLE_API_KEY_ID: ${{ steps.ios_signing.outputs.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ steps.ios_signing.outputs.APPLE_API_ISSUER_ID }}
        run: bundle exec fastlane ios upload_testflight_internal

      - name: Write Actions summary
        if: success()
        env:
          ARTIFACT_SHA256: ${{ steps.verify.outputs.artifact_sha256 }}
          ARTIFACT_SIZE_BYTES: ${{ steps.verify.outputs.artifact_size_bytes }}
          BUILD_NUMBER: ${{ steps.verify.outputs.build_number }}
          BUNDLE_IDENTIFIER: ${{ steps.verify.outputs.bundle_identifier }}
          PROFILE_UUID: ${{ steps.verify.outputs.profile_uuid }}
          TEAM_ID: ${{ steps.verify.outputs.team_id }}
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## iOS TestFlight internal testing'
            echo
            echo "- Bundle: \`${BUNDLE_IDENTIFIER}\`"
            echo "- Version: \`${VERSION_NAME} (${BUILD_NUMBER})\`"
            echo "- Team: \`${TEAM_ID}\`"
            echo "- App Store provisioning profile: \`${PROFILE_UUID}\`"
            echo "- IPA SHA-256: \`${ARTIFACT_SHA256}\`"
            echo "- IPA size: \`${ARTIFACT_SIZE_BYTES} bytes\`"
            echo '- Processing: completed'
            echo "- TestFlight group: \`Internal Testers\`"
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove signing and generated files
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          cleanup_failed=0
          signing_dir="${IOS_SIGNING_DIR:-${RUNNER_TEMP}/kosmo-ios-testflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          profile_install_path="${IOS_PROFILE_INSTALL_PATH:-}"
          if [[ -z "${profile_install_path}" && "${IOS_APP_STORE_PROVISIONING_PROFILE_UUID:-}" =~ ^[A-Fa-f0-9-]{36}$ ]]; then
            profile_install_path="${HOME}/Library/MobileDevice/Provisioning Profiles/${IOS_APP_STORE_PROVISIONING_PROFILE_UUID}.mobileprovision"
          fi

          profile_installed_marker="${signing_dir}/profile-installed"
          if [[ -f "${profile_installed_marker}" ]]; then
            if [[ -n "${profile_install_path}" && ( -e "${profile_install_path}" || -L "${profile_install_path}" ) ]]; then
              if ! rm -f -- "${profile_install_path}"; then
                echo "::error::The temporary provisioning profile could not be removed."
                cleanup_failed=1
              elif [[ -e "${profile_install_path}" || -L "${profile_install_path}" ]]; then
                echo "::error::The temporary provisioning profile is still present."
                cleanup_failed=1
              fi
            fi
          fi

          keychain_path="${IOS_KEYCHAIN_PATH:-${signing_dir}/build.keychain-db}"
          original_keychains_path="${IOS_ORIGINAL_KEYCHAINS_PATH:-${signing_dir}/original-keychains.txt}"
          keychain_list_changed_path="${signing_dir}/keychain-list-changed"
          keychain_cleanup_required=0
          original_keychains=()

          if [[ -f "${keychain_list_changed_path}" || -e "${keychain_path}" || -L "${keychain_path}" ]]; then
            keychain_cleanup_required=1
            if [[ -s "${original_keychains_path}" ]]; then
              while IFS= read -r original_keychain; do
                [[ -n "${original_keychain}" ]] && original_keychains+=("${original_keychain}")
              done < "${original_keychains_path}"
            fi
            if ((${#original_keychains[@]} == 0)); then
              echo "::error::The original keychain list was unavailable for exact restoration."
              cleanup_failed=1
            fi

            if [[ -e "${keychain_path}" || -L "${keychain_path}" ]] && ! security delete-keychain "${keychain_path}"; then
              echo "::error::The temporary keychain could not be removed."
              cleanup_failed=1
            fi
          fi

          keychain_restored_exactly=1
          if ((keychain_cleanup_required != 0)); then
            keychain_restored_exactly=0
            if ((${#original_keychains[@]} > 0)) &&
              security list-keychains -d user -s "${original_keychains[@]}" &&
              security list-keychains -d user | sed -E 's/^[[:space:]]*"//; s/"$//' | cmp -s "${original_keychains_path}" -; then
              keychain_restored_exactly=1
            else
              echo "::error::The original keychain list could not be restored and verified exactly."
              cleanup_failed=1
            fi
          fi

          if ((keychain_restored_exactly != 0)); then
            if ! rm -rf -- "${signing_dir}"; then
              echo "::error::The temporary signing directory could not be removed."
              cleanup_failed=1
            elif [[ -e "${signing_dir}" || -L "${signing_dir}" ]]; then
              echo "::error::The temporary signing directory is still present."
              cleanup_failed=1
            fi
          else
            echo "::error::The temporary keychain cleanup could not be confirmed; keychain and recovery metadata were preserved for manual recovery."
            sensitive_paths=(
              "${IOS_DISTRIBUTION_CERTIFICATE_PATH:-${signing_dir}/distribution.p12}"
              "${IOS_APP_STORE_PROVISIONING_PROFILE_PATH:-${signing_dir}/app-store.mobileprovision}"
              "${IOS_API_KEY_PATH:-${signing_dir}/app-store-connect.p8}"
              "${IOS_IPA_PATH:-${signing_dir}/artifact/Kosmo.ipa}"
              "${IOS_RELEASE_NOTES_PATH:-${signing_dir}/release-notes.txt}"
              "${IOS_EXPORT_OPTIONS_PATH:-${signing_dir}/export-options.plist}"
              "${IOS_ARCHIVE_PATH:-${signing_dir}/Kosmo.xcarchive}"
              "${IOS_ARTIFACT_DIR:-${signing_dir}/artifact}"
              "${signing_dir}/derived-data"
              "${signing_dir}/app-store.mobileprovision.plist"
            )
            for sensitive_path in "${sensitive_paths[@]}"; do
              if [[ -z "${sensitive_path}" || "${sensitive_path}" == "${keychain_path}" || "${sensitive_path}" == "${signing_dir}" ]]; then
                continue
              fi
              if [[ -e "${sensitive_path}" || -L "${sensitive_path}" ]]; then
                if ! rm -rf -- "${sensitive_path}"; then
                  echo "::error::Sensitive temporary path could not be removed: ${sensitive_path}"
                  cleanup_failed=1
                elif [[ -e "${sensitive_path}" || -L "${sensitive_path}" ]]; then
                  echo "::error::Sensitive temporary path is still present: ${sensitive_path}"
                  cleanup_failed=1
                fi
              fi
            done
          fi

          if ! rm -rf -- "${GITHUB_WORKSPACE}/apps/app/ios"; then
            echo "::error::The generated iOS project could not be removed."
            cleanup_failed=1
          fi

          if ((cleanup_failed != 0)); then
            exit 1
          fi
