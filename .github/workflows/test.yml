name: Test

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-suites:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Root
            command: pnpm test:eslint
          - name: Admin
            command: pnpm --filter @kosmo/admin test
          - name: Admin Helm
            command: |
              set -euo pipefail
              helm lint apps/helm --set env=dev
              rendered="$(helm template kosmo apps/helm --namespace kosmo-dev --set env=dev)"
              admin="$(helm template kosmo apps/helm --namespace kosmo-dev --set env=dev --show-only templates/admin/deployment.yaml)"
              for env in PGPASSWORD PGHOST PGPORT PGUSER PGDATABASE; do grep -Fq -- "- name: $env" <<<"$admin"; done
              grep -Eq '^kind: Deployment$' <<<"$rendered"
              grep -Eq '^kind: Service$' <<<"$rendered"
              grep -Eq '^kind: Ingress$' <<<"$rendered"
              grep -Eq '^kind: NetworkPolicy$' <<<"$rendered"
              grep -Eq 'ingressClassName: tailscale' <<<"$rendered"
              grep -Fq 'path: /healthz' <<<"$rendered"
              grep -Fq 'kubernetes.io/metadata.name: tailscale' <<<"$rendered"
              grep -Fq 'tailscale.com/parent-resource-type: ingress' <<<"$rendered"
              grep -Fq 'tailscale.com/parent-resource: "kosmo-admin"' <<<"$rendered"
              grep -Fq 'tailscale.com/parent-resource-ns: "kosmo-dev"' <<<"$rendered"
              if grep -Eq '^kind: HTTPRoute$' <<<"$rendered"; then exit 1; fi
              helm lint apps/helm --set env=prod --set imageDigest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              helm template kosmo apps/helm --namespace kosmo-prod --set env=prod --set imageDigest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa >/dev/null
          - name: Admin Image
            command: |
              set -euo pipefail
              docker build --target runtime --tag kosmo-admin-smoke .
              container="$(docker run --detach --rm --publish 127.0.0.1:18080:8080 kosmo-admin-smoke admin)"
              trap 'docker stop "$container" >/dev/null 2>&1 || true' EXIT
              timeout 30 sh -c 'until test "$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:18080/healthz)" = 200; do sleep 1; done'
              health_post="$(curl --silent --show-error --dump-header - --output /dev/null --request POST http://127.0.0.1:18080/healthz)"
              grep -Eq '^HTTP/[0-9.]+ 405 ' <<<"$health_post"
              grep -Eiq '^allow:[[:space:]]*GET([[:space:]]|$)' <<<"$health_post"
              shell="$(curl --silent --show-error --dump-header - http://127.0.0.1:18080/)"
              grep -Eq '^HTTP/[0-9.]+ 200 ' <<<"$shell"
              grep -Eiq '^cache-control:[[:space:]]*.*no-store' <<<"$shell"
              csp="$(grep -i '^content-security-policy:' <<<"$shell")"
              for source in "script-src 'self'" "style-src 'self'" "connect-src 'self'" "object-src 'none'" "frame-ancestors 'none'"; do grep -Fq "$source" <<<"$csp"; done
              grep -Eiq "script-src[^;]*'nonce-[^']+'|script-src[^;]*'sha256-[^']+'" <<<"$csp"
              escaped="$(curl --silent --show-error --dump-header - --header 'Tailscale-User-Name: <script>alert(1)</script>' http://127.0.0.1:18080/)"
              grep -Eq '^HTTP/[0-9.]+ 200 ' <<<"$escaped"
              grep -Fq '&lt;script>alert(1)&lt;/script>' <<<"$escaped"
              if grep -Fq '<script>alert(1)</script>' <<<"$escaped"; then exit 1; fi
              shell_post="$(curl --silent --show-error --dump-header - --output /dev/null --request POST http://127.0.0.1:18080/)"
              grep -Eq '^HTTP/[0-9.]+ 405 ' <<<"$shell_post"
              grep -Eiq '^allow:[[:space:]]*GET([[:space:]]|$)' <<<"$shell_post"
              test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/graphql)" = 404
          - name: Core
            command: pnpm --filter @kosmo/core test
            database: true
          - name: Fedify
            command: pnpm --filter @kosmo/fedify test
            database: true
          - name: API
            command: pnpm --filter @kosmo/api test
            database: true
          - name: App
            command: pnpm --filter @kosmo/app test
            playwright: true
          - name: Web
            command: pnpm --filter @kosmo/web check && pnpm --filter @kosmo/web test:unit
          - name: Worker
            command: pnpm --filter @kosmo/worker test
            database: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          cache: true

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        if: matrix.playwright
        shell: bash
        run: echo "version=$(pnpm --filter @kosmo/app exec playwright --version | sed 's/^Version //')" >> "${GITHUB_OUTPUT}"

      - name: Cache Playwright browsers
        id: playwright-cache
        if: matrix.playwright
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright OS dependencies
        if: matrix.playwright
        run: pnpm --filter @kosmo/app exec playwright install-deps chromium

      - name: Install Playwright Chromium
        if: matrix.playwright && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @kosmo/app exec playwright install chromium

      - name: Run ${{ matrix.name }} tests
        run: ${{ matrix.command }}

      - name: Clean up test database
        if: always() && matrix.database
        run: pnpm db:test:drop

  web_e2e:
    name: Web E2E (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            port_offset: 10000
          - shard: 2
            port_offset: 20000
          - shard: 3
            port_offset: 30000
    env:
      DATABASE_URL: postgres://kosmo:kosmo@localhost:54329/kosmo_test_web_e2e_shard_${{ matrix.shard }}
      KOSMO_TEST_PORT_OFFSET: ${{ matrix.port_offset }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          cache: true

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        shell: bash
        run: echo "version=$(pnpm --filter @kosmo/app exec playwright --version | sed 's/^Version //')" >> "${GITHUB_OUTPUT}"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright OS dependencies
        run: pnpm --filter @kosmo/app exec playwright install-deps chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @kosmo/app exec playwright install chromium

      - name: Run Web E2E shard
        run: node scripts/test-db.mjs run -- pnpm test:e2e:database --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts-web-shard-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up test database
        if: always()
        run: pnpm db:test:drop

  test:
    name: Test
    if: always()
    needs:
      - test-suites
      - web_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test suite
        run: |
          test "${{ needs.test-suites.result }}" = success
          test "${{ needs.web_e2e.result }}" = success
