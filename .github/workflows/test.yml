name: Test

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-suites:
    name: Test (${{ matrix.name }})
    # runs-on: [self-hosted]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Root
            command: pnpm test:eslint && pnpm test:helm
            database: false
            helm: true
            id: root
            playwright: false
          - name: Core
            command: pnpm --filter @kosmo/core test
            database: true
            helm: false
            id: core
            playwright: false
          - name: Fedify
            command: pnpm --filter @kosmo/fedify test
            database: true
            helm: false
            id: fedify
            playwright: false
          - name: API
            command: pnpm --filter @kosmo/api test
            database: true
            helm: false
            id: api
            playwright: false
          - name: App
            command: pnpm --filter @kosmo/app test
            database: false
            helm: false
            id: app
            playwright: true
          - name: Web
            command: pnpm --filter @kosmo/web test
            database: true
            helm: false
            id: web
            playwright: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          cache: true

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: matrix.playwright
        run: pnpm --filter @kosmo/app exec playwright install --with-deps chromium

      - name: Set up Helm
        if: matrix.helm
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          cache: true
          install_args: helm
          working_directory: apps/helm

      - name: Run ${{ matrix.name }} tests
        run: ${{ matrix.command }}

      - name: Upload Playwright artifacts
        if: failure() && matrix.id == 'web'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts-${{ matrix.id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up test database
        if: always() && matrix.database
        run: pnpm db:test:drop

  test:
    name: Test
    if: always()
    needs: test-suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test suite
        env:
          TEST_SUITES_RESULT: ${{ needs.test-suites.result }}
        run: test "${TEST_SUITES_RESULT}" = success
