packages:
  - apps/*
  - packages/*

enableGlobalVirtualStore: false
pmOnFail: ignore
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Transitive entries still pinned by upstream packages; keep exceptions version-pinned.
  - chokidar@4.0.3
  - semver@6.3.1
minimumReleaseAge: 10080
allowBuilds:
  '@firebase/util': false
  '@fission-ai/openspec': true
  '@sentry/cli': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  core-js: true
  esbuild: true
  protobufjs: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  # fast-uri 3.1.8 fixes GHSA-hrr3-gc8f-f4qj within Ajv's accepted 3.x range.
  - fast-uri@3.1.8
  # Allow only the patched Vitest 4.1.12 release set past the seven-day age gate.
  - vitest@4.1.12
  - '@vitest/browser@4.1.12'
  - '@vitest/browser-playwright@4.1.12'
  - '@vitest/expect@4.1.12'
  - '@vitest/mocker@4.1.12'
  - '@vitest/pretty-format@4.1.12'
  - '@vitest/runner@4.1.12'
  - '@vitest/snapshot@4.1.12'
  - '@vitest/spy@4.1.12'
  - '@vitest/utils@4.1.12'
  # Temporal 1.22.0 clears GHSA-4w2j-m93h-cj5j from the bundled Rust lockfile.
  - '@temporalio/activity@1.22.0'
  - '@temporalio/client@1.22.0'
  - '@temporalio/common@1.22.0'
  - '@temporalio/core-bridge@1.22.0'
  - '@temporalio/nexus@1.22.0'
  - '@temporalio/proto@1.22.0'
  - '@temporalio/worker@1.22.0'
  - '@temporalio/workflow@1.22.0'
  # Allow only the requested Fedify 2.4.0 upgrade past the release-age gate.
  - '@fedify/fedify@2.4.0'
  - '@fedify/postgres@2.4.0'
  - '@fedify/uri-template@2.4.0'
  - '@fedify/vocab-runtime@2.4.0'
  - '@fedify/vocab-tools@2.4.0'
  - '@fedify/vocab@2.4.0'
  - '@fedify/webfinger@2.4.0'
overrides:
  # source-map-js 1.2.2 fixes CVE-2026-93749 within consumers' 1.x range.
  'source-map-js@<1.2.2': ^1.2.2
  '@opentelemetry/sdk-metrics@<2.8.0': ^2.8.0
  'undici@': 6.28.1
  # Ajv accepts fast-uri 3.x, so keep the security override within its declared range.
  'ajv@8.20.0>fast-uri': 3.1.8
  # minimatch 10 accepts brace-expansion 5.x; keep older minimatch lines unchanged.
  'brace-expansion@^5.0.0': 5.0.12
  # Expo Router exposes broad native peers; align every peer snapshot with SDK 56 / RN 0.85.
  '@react-native/metro-config': 0.85.3
  # eslint-react 5.11.3 accepts 8.62.1; avoid newer incomplete registry dependency graphs.
  '@typescript-eslint/scope-manager': 8.62.1
  '@typescript-eslint/type-utils': 8.62.1
  '@typescript-eslint/types': 8.62.1
  '@typescript-eslint/typescript-estree': 8.62.1
  '@typescript-eslint/utils': 8.62.1
  '@typescript-eslint/visitor-keys': 8.62.1
  cookie@<0.7.0: ^0.7.0
  esbuild@<0.28.1: ^0.28.1
  # Keep fbjs's declared parser without crossing into the later provenance-downgrade releases.
  'fbjs@3.0.5>ua-parser-js': 1.0.39
  # query-string 7.1.3 is CommonJS; use the patched decoder below to preserve that contract.
  'query-string@7.1.3>decode-uri-component': 0.5.0
  # xcode@3.0.1 requires uuid ^7 but only uses the CommonJS v4 API; uuid 11.1.1
  # preserves that API while resolving GHSA-w5hq-g745-h8pq.
  'xcode@3.0.1>uuid': 11.1.1
  react-native-reanimated: 4.3.1
  react-native-worklets: 0.8.3
  # Replace only grpc-js ranges below the first patched release with 1.14.5.
  '@grpc/grpc-js@<1.13.6': 1.14.5
  # react-devtools-core accepts shell-quote 1.x; use its patched 1.12.0 release.
  'react-devtools-core@6.1.5>shell-quote': 1.12.0
  # SvelteKit/Svelte accept 5.x; 5.9.3 fixes shared-memory disclosure and three DoS advisories.
  'devalue@': 5.9.3
  # jsdom accepts ^7.25.0; fix CVE-2026-19534 / CVE-2026-84961 without replacing 6.x.
  'jsdom@29.1.1>undici': 7.29.1
# TODO(PROD-916): Remove this patch, its override, and patch file after a compatible upstream update.
patchedDependencies:
  decode-uri-component@0.5.0: patches/decode-uri-component@0.5.0.patch
  # TODO(PROD-1103): Remove after verifying a compatible upstream release.
  # See patches/expo-router.md for rationale and removal checks.
  expo-router@56.2.13: patches/expo-router@56.2.13.patch
