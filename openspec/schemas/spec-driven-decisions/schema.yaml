name: spec-driven-decisions
version: 2
description: Short-lived OpenSpec session harness with optional notes and a minimal proposal-to-task path

artifacts:
  - id: proposal
    generates: proposal.md
    description: Session brief containing the goal, non-goals, constraints, and verification target
    template: proposal.md
    instruction: |
      Create a short session brief for the current work. Capture only the goal,
      non-goals, constraints, expected verification, and optional links to the
      business context in canonical docs or Linear.

      Use memory/issue-openspec-workflow.md for the definition of current user
      agreement. Canonical docs, Linear, and explicit current user agreement own
      business requirements, observable guarantees, policy, and scope. This
      brief is mutable working context; it does not add requirements, approve a
      design, or establish durable implementation choices.
      Do not copy implementation details into the brief merely to make the plan
      look complete. If an old change or another OpenSpec artifact disagrees with
      settled current context, correct or omit it; record an open question only
      when the current decision is genuinely unresolved.

      Keep this artifact small enough to reread at the start of one session.
    requires: []

  - id: tasks
    generates: tasks.md
    description: Session checklist with focused work, verification, and progress
    template: tasks.md
    instruction: |
      Turn the current brief into the smallest checklist that can complete this
      session's goal. Every checkbox must name work or verification that is still
      needed now. Concrete steps may be recorded when they help this session, but
      they are not binding or durable implementation rules and must not introduce
      future features.

      Mark a task complete only after its verification evidence exists. If
      investigation shows that a task is unnecessary, remove it or mark it
      `Not needed` and continue; do not implement work only to satisfy a stale
      checklist. Keep verification and progress notes close to the tasks they
      describe so another session can understand what was actually done.

      This is the minimum apply path. Optional specs, design notes, and decision
      notes are not prerequisites and must not become hidden work through task
      wording.
    requires:
      - proposal

  - id: specs
    generates: 'specs/**/*.md'
    description: Optional session behavior notes for examples that need CLI-compatible delta sections
    template: spec.md
    instruction: |
      Use this artifact only when concrete behavior examples make the current
      session easier to implement or verify. Keep the existing delta headings so
      the OpenSpec CLI can parse them, but treat the content as temporary notes.

      A spec note cannot create or expand a product requirement. Canonical docs,
      Linear, and explicit current user agreement remain the business authority.
      If a behavior is not already approved there, leave it as an open question
      and do not write it as a SHALL/MUST requirement. Archive this change with `--skip-specs`; do not
      promote session notes into long-lived specs automatically.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Optional non-binding implementation notes for the current session
    template: design.md
    instruction: |
      Add this artifact only when the session benefits from recording current
      constraints, a practical approach, alternatives, or traps. Keep every note
      non-binding and local to this session. Do not turn a recommended approach,
      filename, helper, data shape, or dependency into a durable rule. Remove or
      correct notes when the implementation reveals they are unnecessary.
    requires:
      - proposal

  - id: decisions
    generates: decisions.md
    description: Optional session notes for current reasoning and choices settled in context
    template: decisions.md
    instruction: |
      Use this artifact only to make a current session's reasoning easy to follow.
      It records neither product authority nor durable implementation decisions.
      A choice that changes business behavior, public contracts, security,
      rollout, ownership, or long-lived compatibility must be decided in the
      applicable canonical or Linear workflow, or explicitly by the current user,
      before it is treated as binding. Routine implementation rationale may be
      recorded here without becoming a durable rule. Keep unresolved choices open
      and do not use this file as their approval.
    requires:
      - proposal

apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Use proposal.md and tasks.md as mutable context for this session. Recheck
    current business requirements, observable guarantees, and policy in the
    applicable canonical docs, Linear, and explicit current user agreement before
    implementing; OpenSpec is not evidence that an upstream requirement exists.
    Use memory/issue-openspec-workflow.md for the definition of current user
    agreement. Old Domain/Issue/OpenSpec artifact-transition gates are not
    implementation prerequisites.

    Optional specs, design.md, and decisions.md are context only. They are not
    prerequisites, do not create authority, and do not automatically carry into
    a later session. Treat archived or older OpenSpec artifacts the same way.

    Work through only the tasks that still contribute to the current goal. Remove
    or mark stale tasks as `Not needed` rather than implementing them for
    checklist completeness. Finish when the goal and its focused verification
    are complete; do not expand the session to satisfy optional artifacts.
