schema: spec-driven-decisions

context: |
  OpenSpec은 선택적인 단기 세션 하네스다. 현재 사용자 합의와 canonical·Linear의
  비즈니스 요구사항·관찰 가능한 보장·정책·범위를 실행하는 데 필요한 goal,
  non-goals, constraints, verification, progress만 기록한다.
  하네스는 요구사항·권위·영구 구현 결정을 추가하지 않으며, 불필요한 내용은
  줄이거나 제거한다. 이전 세션의 artifact도 자동으로 상속하지 않는다.
  자세한 경계와 수명 정책은 memory/issue-openspec-workflow.md를 따른다.
  proposal, specs, design, decisions, tasks는 한국어를 기본 언어로 작성한다.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
